# Fixture spec for the helper's own tests (node --test packages/backend-test-utils/test/).
# It follows the service conventions (docs/testing/backend-openapi.md) and is linted with
# the services' specs, so it doubles as a small worked example.
openapi: 3.1.1
info:
  title: Fixture service
  version: '1'
  description: Not a real service. Used by the tests of packages/backend-test-utils.
  license: {name: ISC, identifier: ISC}
servers:
  - url: /api/fixture
security:
  - XAuthToken: []
tags:
  - name: general
  - name: courses
paths:
  /healthcheck:
    get:
      operationId: getHealthcheck
      summary: Health check
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /members/me:
    get:
      operationId: getMe
      summary: The current user
      tags: [general]
      x-permission: authenticated
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getMember
      summary: One member
      tags: [general]
      x-permission: optional login; anonymous callers get fewer fields
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberResponse'}
        '404':
          $ref: '#/components/responses/NotFound'
  /courses:
    get:
      operationId: listCourses
      summary: List courses
      tags: [courses]
      x-permission: view:fixture
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The courses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createCourse
      summary: Create a course
      tags: [courses]
      x-permission: manage:fixture
      # One exemption, one operation, one reason (a shared response cannot carry it).
      x-untested:
        '403': needs a core that answers 403 on my_permissions, which the mocks cannot do
      requestBody:
        $ref: '#/components/requestBodies/CourseInput'
      responses:
        '201':
          description: The created course.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not allowed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /courses/{course_id}:
    parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: getCourse
      summary: One course
      tags: [courses]
      x-permission: view:fixture
      responses:
        '200':
          description: The course.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteCourse
      summary: Delete a course
      tags: [courses]
      x-permission: manage:fixture
      responses:
        '204':
          description: Deleted, no body.
        '404': {$ref: '#/components/responses/NotFound'}
  /courses/{course_id}/export:
    parameters:
      - name: course_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: exportCourse
      summary: Export a course as a spreadsheet
      tags: [courses]
      x-permission: manage:fixture
      responses:
        '200':
          description: The spreadsheet.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
components:
  securitySchemes:
    XAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Access token issued by core. Other services check it against core on every request.
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0}}
    UserId:
      name: user_id
      in: path
      required: true
      description: A user id, or `me` for the current user (Express routes both through this path).
      schema: {type: [integer, string]}
  requestBodies:
    CourseInput:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CourseInput'}
  responses:
    BadRequest: {description: 'Malformed request, for example a non-numeric ID.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: 'No token, or the token was rejected.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: 'A resource in the path does not exist.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationFailed: {description: 'Validation failed.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/ErrorWithMessage'
        - $ref: '#/components/schemas/ErrorWithFields'
    ErrorWithMessage:
      type: object
      required: [success, message]
      properties:
        success: {const: false}
        message: {type: string}
      additionalProperties: false
    ErrorWithFields:
      type: object
      required: [success, errors]
      properties:
        success: {const: false}
        errors:
          type: object
          additionalProperties: {type: array, items: {type: string}}
      additionalProperties: false
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {const: true}
        message: {type: string}
      additionalProperties: false
    ListMeta:
      type: object
      required: [count]
      properties:
        count: {type: integer, minimum: 0}
      additionalProperties: false
    Timestamps:
      type: object
      required: [created_at, updated_at]
      properties:
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Decimal:
      description: Sequelize DECIMAL. A string when read from Postgres, the input value right after create or update.
      type: [string, number]
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Course:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [id, name, description, fee]
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: [string, 'null']}
        fee: {$ref: '#/components/schemas/Decimal'}
        custom_fields:
          description: JSONB that each body fills with its own keys.
          type: [object, 'null']
          x-free-form: each body defines its own keys; the service stores them without looking at them
      unevaluatedProperties: false
    CourseInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        description: {type: [string, 'null']}
        fee: {type: [string, number]}
      additionalProperties: true
    CourseResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Course'}
      additionalProperties: false
    CourseListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/Course'}}
        meta: {$ref: '#/components/schemas/ListMeta'}
      additionalProperties: false
    Member:
      type: object
      required: [id, first_name]
      properties:
        id: {type: integer}
        first_name: {type: string}
      additionalProperties: false
    MemberResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Member'}
      additionalProperties: false
