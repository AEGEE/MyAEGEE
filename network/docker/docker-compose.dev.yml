services:
  network:
    restart: "no"
    depends_on:
      postgres-network:
        condition: service_healthy
    build:
      context: ./${PATH_NETWORK}/..
      dockerfile: ./docker/network/Dockerfile
    image: aegee/network:dev
    volumes:
      - ./${PATH_NETWORK}/../config:/usr/app/src/config
      - ./${PATH_NETWORK}/../lib:/usr/app/src/lib
      - ./${PATH_NETWORK}/../migrations:/usr/app/src/migrations
      - ./${PATH_NETWORK}/../models:/usr/app/src/models
    command: "sh -c 'sh /usr/app/scripts/bootstrap.sh && npm run nodemon-start | bunyan'"

  postgres-network:
    restart: "no"
    # TCP: while initialising, Postgres only listens on a Unix socket.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
