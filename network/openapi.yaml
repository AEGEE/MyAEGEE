openapi: 3.1.1
info:
  title: MyAEGEE network
  version: '1'
  description: >-
    Boards of bodies, Antenna Criteria, NetCom assignment and the Antenna Criteria
    fulfilment mail. Every route except the health check and the metrics needs an
    X-Auth-Token, which the service checks against core on every request
    (GET /members/me, GET /my_permissions and POST /my_permissions for the local
    manage_network:boards permission). See docs/testing/backend-openapi.md.
  license: {name: ISC, identifier: ISC}
servers:
  - url: /api/network
security:
  - XAuthToken: []
tags:
  - name: general
  - name: boards
  - name: antenna_criteria
  - name: netcom
  - name: mail_component
paths:
  /healthcheck:
    get:
      operationId: getHealthcheck
      summary: Health check
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthcheckResponse'}
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics of the database content
      tags: [general]
      x-permission: none (the gateway puts basic auth on it)
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /metrics/requests:
    get:
      operationId: getRequestMetrics
      summary: Prometheus metrics of the requests per endpoint
      tags: [general]
      x-permission: none (the gateway puts basic auth on it)
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /boards:
    get:
      operationId: listBoards
      summary: List the boards of all bodies
      tags: [boards]
      x-permission: global:view:board
      parameters:
        - $ref: '#/components/parameters/BoardSort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The boards, ordered by `sort` (default `id`) and `direction` (default ascending).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /boards/recents:
    get:
      operationId: listRecentBoardElections
      summary: The latest board election of each body
      tags: [boards]
      x-permission: global:view:board
      parameters:
        - name: ends
          in: query
          description: >-
            Count elections up to the end of this day (default today): a date, or a full
            ISO 8601 timestamp with a time zone, which counts by its date part, as the
            Antenna Criteria page sends an Agora's end. Anything else answers 422.
          schema: {$ref: '#/components/schemas/DateInput'}
      responses:
        '200':
          description: One row per body with a board elected up to that day.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecentBoardElectionListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/boards:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: listBodyBoards
      summary: List the boards of a body
      tags: [boards]
      x-permission: global:view:board
      parameters:
        - $ref: '#/components/parameters/BoardSort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The boards of the body; an empty list for a body without boards.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createBoard
      summary: Add a board to a body
      description: >-
        Checks the board, then asks core (with the caller's token) for the body and
        every member on the board: an unknown body answers 404; a member core does not
        know, or does not let the caller see, answers 422 on that field. Then stores the
        board and sends the "new board" mail to NetCom, and the welcome mail to the board
        if its term has started. Both mails are best effort: a failure is logged and the
        board stays created.
      tags: [boards]
      x-permission: local manage_network:boards for the body in the URL, or global:manage_network:boards
      requestBody:
        $ref: '#/components/requestBodies/BoardInput'
      responses:
        '200':
          description: The stored board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Core does not know the body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/boards/current:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: listCurrentBodyBoards
      summary: The boards of a body whose term includes today
      tags: [boards]
      x-permission: global:view:board
      responses:
        '200':
          description: The current boards, latest start first (a list, normally of one).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The body has no current board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /bodies/{body_id}/boards/{board_id}:
    parameters:
      - $ref: '#/components/parameters/BodyId'
      - name: board_id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
    get:
      operationId: getBoard
      summary: One board of a body
      tags: [boards]
      x-permission: global:view:board, or local manage_network:boards for the body in the URL, or global:manage_network:boards
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateBoard
      summary: Edit a board of a body
      description: The body stays the one in the URL; `id` and `new_board_email_sent_at` in the request are ignored.
      tags: [boards]
      x-permission: local manage_network:boards for the body in the URL, or global:manage_network:boards
      requestBody:
        $ref: '#/components/requestBodies/BoardInput'
      responses:
        '200':
          description: The updated board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteBoard
      summary: Delete a board of a body
      tags: [boards]
      x-permission: global:manage_network:boards
      responses:
        '200':
          description: The deleted board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /antennaCriteria/{agora_id}:
    parameters:
      - $ref: '#/components/parameters/AgoraId'
    get:
      operationId: listAntennaCriteria
      summary: The Antenna Criteria fulfilment of all bodies for an Agora
      tags: [antenna_criteria]
      x-permission: global:manage_network:antenna_criteria
      responses:
        '200':
          description: The criteria set for the Agora.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AntennaCriterionListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /antennaCriteria:
    put:
      operationId: setAntennaCriterion
      summary: Create or update one Antenna Criterion of a body for an Agora
      description: >-
        A body that is not an object answers 400, and an unknown criterion 422, both
        before the permission check. The value `exception` for `communication` also needs
        global:manage_network:communication_exception. Only `agora_id`, `body_id`,
        `antenna_criterion`, `value` and `comment` are read; the whole row is checked
        before it is stored.
      tags: [antenna_criteria]
      x-permission: global:manage_network:<criterion>, the criterion's name with underscores
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AntennaCriterionInput'}
      responses:
        '200':
          description: The stored criterion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AntennaCriterionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /antennaCriteria/sendFulfilmentMail:
    post:
      operationId: sendFulfilmentMail
      summary: Send the Antenna Criteria fulfilment mail to a body
      description: >-
        Sends the text through the mailer's `custom.html` template. Every address is one
        address without a display name (a dot-atom local part and a domain of at least two
        labels); `from` must be on aegee.org or aegee.eu (default network@aegee.eu). `to`
        and `cc` also take several addresses, as a list or as one string separated by
        commas. The addresses and the subject are one line each; the subject is at most
        255 characters.
      tags: [antenna_criteria]
      x-permission: global:manage_network:fulfilment_email
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FulfilmentMailInput'}
      responses:
        '200':
          description: The mailer accepted the mail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /netcom:
    get:
      operationId: listNetcomAssignments
      summary: The Network Commissioner of each body
      tags: [netcom]
      x-permission: global:manage_network:netcom_assignment
      responses:
        '200':
          description: All assignments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetcomListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: setNetcomAssignment
      summary: Assign a Network Commissioner to a body
      description: >-
        Only `body_id` and `netcom_id` are read; both are checked before the assignment is
        stored. A body that is not an object answers 400.
      tags: [netcom]
      x-permission: global:manage_network:netcom_assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetcomInput'}
      responses:
        '200':
          description: The stored assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetcomResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /netcom/{body_id}:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    delete:
      operationId: removeNetcomAssignment
      summary: Remove the Network Commissioner of a body
      tags: [netcom]
      x-permission: global:manage_network:netcom_assignment
      responses:
        '200':
          description: The assignment is removed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /mailComponent/{agora_id}:
    parameters:
      - $ref: '#/components/parameters/AgoraId'
    get:
      operationId: listMailComponents
      summary: The fulfilment mail texts of an Agora
      tags: [mail_component]
      x-permission: global:manage_network:fulfilment_email
      responses:
        '200':
          description: The texts set for the Agora.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailComponentListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /mailComponent:
    put:
      operationId: setMailComponent
      summary: Create or update one fulfilment mail text of an Agora
      description: >-
        Only `agora_id`, `mail_component` and `text` are read; all three are checked before
        the text is stored. A body that is not an object answers 400.
      tags: [mail_component]
      x-permission: global:manage_network:fulfilment_email
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MailComponentInput'}
      responses:
        '200':
          description: The stored text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailComponentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
components:
  securitySchemes:
    XAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Access token issued by core. Other services check it against core on every request.
  parameters:
    Direction: {name: direction, in: query, schema: {type: string, enum: [asc, desc]}}
    BoardSort:
      name: sort
      in: query
      description: Sort field; any other value is ignored.
      schema: {type: string, enum: [id, body_id, elected_date, start_date, end_date]}
    BodyId:
      name: body_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    AgoraId:
      name: agora_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
  requestBodies:
    BoardInput:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BoardInput'}
  responses:
    BadRequest: {description: 'Malformed request, for example a non-numeric ID.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: 'No token, or the token was rejected.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: 'Authenticated but not allowed (see x-permission).', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: 'A resource in the path does not exist.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationFailed: {description: 'Validation failed.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/ErrorWithMessage'
        - $ref: '#/components/schemas/ErrorWithFields'
    ErrorWithMessage:
      type: object
      required: [success, message]
      properties:
        success: {const: false}
        message: {type: string}
      additionalProperties: false
    ErrorWithFields:
      type: object
      required: [success, errors]
      properties:
        success: {const: false}
        errors:
          type: object
          additionalProperties: {type: array, items: {type: string}}
      additionalProperties: false
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {const: true}
        message: {type: string}
      additionalProperties: false
    Timestamps:
      type: object
      required: [created_at, updated_at]
      properties:
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HealthcheckResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: object
          required: [name, description, version]
          properties:
            name: {type: string}
            description: {type: string}
            version: {type: string}
          additionalProperties: false
      additionalProperties: false
    Id:
      description: An ID, which fits a Postgres INTEGER.
      type: integer
      minimum: 0
      maximum: 2147483647
    IdInput:
      description: An ID as a number or as a string of digits; the answer has the number.
      anyOf:
        - {$ref: '#/components/schemas/Id'}
        - {type: string, pattern: '^[0-9]{1,10}$'}
    MemberIdInput:
      description: >-
        A member's ID, from 1, as a number or as a string of digits; the answer has the
        number.
      anyOf:
        - {type: integer, minimum: 1, maximum: 2147483647}
        - {type: string, maxLength: 10, pattern: '^[0-9]*[1-9][0-9]*$'}
    DateInput:
      description: >-
        A date, or a full ISO 8601 timestamp with a time zone, which is stored as the day
        it is written with.
      anyOf:
        - {type: string, format: date}
        - {type: string, format: date-time}
    BoardPosition:
      type: object
      required: [function, user_id]
      properties:
        function: {type: string}
        user_id: {type: integer}
      additionalProperties: false
    Board:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [id, body_id, elected_date, start_date, end_date, name, president, secretary, treasurer, other_members, message, new_board_email_sent_at, image_id]
      properties:
        id: {type: integer}
        body_id: {type: integer}
        elected_date: {type: string, format: date}
        start_date: {type: string, format: date}
        end_date: {type: [string, 'null'], format: date}
        name: {type: [string, 'null']}
        president: {type: integer}
        secretary: {type: integer}
        treasurer: {type: integer}
        other_members:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/BoardPosition'}
        message: {type: [string, 'null']}
        new_board_email_sent_at: {type: [string, 'null'], format: date-time}
        image_id: {type: [integer, 'null']}
      unevaluatedProperties: false
    BoardInput:
      type: object
      properties:
        elected_date: {$ref: '#/components/schemas/DateInput'}
        start_date: {$ref: '#/components/schemas/DateInput'}
        end_date:
          anyOf:
            - {$ref: '#/components/schemas/DateInput'}
            - {type: 'null'}
        name: {type: [string, 'null'], maxLength: 255}
        president: {$ref: '#/components/schemas/MemberIdInput'}
        secretary: {$ref: '#/components/schemas/MemberIdInput'}
        treasurer: {$ref: '#/components/schemas/MemberIdInput'}
        other_members:
          type: [array, 'null']
          items:
            type: object
            required: [function, user_id]
            properties:
              function: {type: string, minLength: 1}
              user_id: {type: integer, minimum: 1, maximum: 2147483647}
        message: {type: [string, 'null']}
        image_id:
          anyOf:
            - {$ref: '#/components/schemas/IdInput'}
            - {type: 'null'}
      additionalProperties: true
    BoardResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Board'}
      additionalProperties: false
    BoardListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: array
          items: {$ref: '#/components/schemas/Board'}
      additionalProperties: false
    RecentBoardElection:
      type: object
      required: [body_id, latest_election]
      properties:
        body_id: {type: integer}
        latest_election: {type: string, format: date}
      additionalProperties: false
    RecentBoardElectionListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: array
          items: {$ref: '#/components/schemas/RecentBoardElection'}
      additionalProperties: false
    AntennaCriterionName:
      type: string
      enum: [communication, board election, members list, membership fee, events, agora attendance, development plan, fulfilment report]
    AntennaCriterionValue:
      type: [string, 'null']
      enum: ['true', 'false', exception, null]
    AntennaCriterion:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [agora_id, body_id, antenna_criterion, value, comment]
      properties:
        agora_id: {type: integer}
        body_id: {type: integer}
        antenna_criterion: {$ref: '#/components/schemas/AntennaCriterionName'}
        value: {$ref: '#/components/schemas/AntennaCriterionValue'}
        comment: {type: [string, 'null']}
      unevaluatedProperties: false
    AntennaCriterionInput:
      type: object
      required: [agora_id, body_id, antenna_criterion]
      properties:
        agora_id: {$ref: '#/components/schemas/IdInput'}
        body_id: {$ref: '#/components/schemas/IdInput'}
        antenna_criterion: {$ref: '#/components/schemas/AntennaCriterionName'}
        value: {$ref: '#/components/schemas/AntennaCriterionValue'}
        comment: {type: [string, 'null']}
      additionalProperties: true
    AntennaCriterionResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/AntennaCriterion'}
      additionalProperties: false
    AntennaCriterionListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: array
          items: {$ref: '#/components/schemas/AntennaCriterion'}
      additionalProperties: false
    MailAddress: {type: string, format: email, maxLength: 254}
    MailAddressString:
      description: >-
        Several addresses in one string, separated by commas, as the send dialog's field
        holds them. Spaces and tabs around each address are dropped; each must be an
        address. The mailer gets them as a list.
      type: string
      pattern: '^[^,\r\n]+(,[^,\r\n]+)+$'
    FulfilmentMailInput:
      type: object
      required: [to, subject, body]
      properties:
        from:
          description: One address on aegee.org or aegee.eu; empty or absent sends from network@aegee.eu.
          anyOf:
            - {$ref: '#/components/schemas/MailAddress'}
            - {type: string, maxLength: 0}
            - {type: 'null'}
        to:
          anyOf:
            - {$ref: '#/components/schemas/MailAddress'}
            - {$ref: '#/components/schemas/MailAddressString'}
            - {type: array, minItems: 1, items: {$ref: '#/components/schemas/MailAddress'}}
        cc:
          anyOf:
            - {$ref: '#/components/schemas/MailAddress'}
            - {$ref: '#/components/schemas/MailAddressString'}
            - {type: array, minItems: 1, items: {$ref: '#/components/schemas/MailAddress'}}
            - {type: string, maxLength: 0}
            - {type: 'null'}
        reply_to:
          anyOf:
            - {$ref: '#/components/schemas/MailAddress'}
            - {type: string, maxLength: 0}
            - {type: 'null'}
        subject: {type: string, minLength: 1, maxLength: 255, pattern: '^[^\r\n]+$'}
        body: {type: string, minLength: 1, description: The HTML text of the mail.}
      additionalProperties: true
    Netcom:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [body_id, netcom_id]
      properties:
        body_id: {type: integer}
        netcom_id: {type: integer}
      unevaluatedProperties: false
    NetcomInput:
      type: object
      required: [body_id, netcom_id]
      properties:
        body_id: {$ref: '#/components/schemas/IdInput'}
        netcom_id: {$ref: '#/components/schemas/IdInput'}
      additionalProperties: true
    NetcomResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Netcom'}
      additionalProperties: false
    NetcomListResponse:
