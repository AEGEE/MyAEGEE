          override-ci-command: npm ci --legacy-peer-deps
      - attach_workspace:
          at: ~/shard
      - run: node packages/backend-test-utils/check-coverage.js network --expect 1 ~/shard/coverage-*.json
      - run: node packages/backend-test-utils/unexercised.js network ~/shard/openapi-hits-*.txt
      - run:
          name: Every coverage ignore has a reason
          command: "! grep -rnE 'istanbul ignore (next|if|else|file) *(\\*/|$)' network/lib network/models"
