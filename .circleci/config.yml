orbs:
  shellcheck: circleci/shellcheck@3.4.0
version: 2.1
jobs:
  yamllint:
    docker:
      - image: cimg/python:3.13.11
    steps:
      - checkout
      - run: pip install yamllint
      - run: yamllint -d .yamllint.yml .
  pylint:
    docker:
      - image: cimg/python:3.13.11
    steps:
      - checkout
      - run: pip install pylint
      # FIXME: enable W0511 and E0401 as well
      - run: pylint scripts-server --disable C0114,C0116,W0511,E0401
  hadolint:
    docker:
      - image: hadolint/hadolint:latest-alpine
    steps:
      - checkout
      - run:
          name: Lint Dockerfiles
          command: hadolint $(find . -name '*Dockerfile*')
  shellcheck:
    docker:
      - image: cimg/base:2025.12
    steps:
      - checkout
      - shellcheck/install
      - shellcheck/check:
          exclude: SC2002,SC2086,SC2126,SC2154
workflows:
  lint-yaml:
    jobs:
      - yamllint
  lint-shell:
    jobs:
      - shellcheck
  lint-python:
    jobs:
      - pylint
  lint-dockerfile:
    jobs:
      - hadolint
