    docker:
      - image: cimg/node:26.13.1
      - image: cimg/postgres:18.7
        environment:
          POSTGRES_PASSWORD: config.test.postgres.password
    parallelism: 1  # the suite takes seconds; unsharded (docs/testing/backend-openapi.md)
    resource_class: large
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/network
          override-ci-command: npm ci --legacy-peer-deps
      - run: mkdir -p ~/reports/jest
      - run:
          name: Run network tests
          working_directory: ~/project/network
          command: |
            mkdir -p ~/shard
            OPENAPI_HITS_FILE=$HOME/shard/openapi-hits-$CIRCLE_NODE_INDEX.txt \
            JEST_JUNIT_OUTPUT_DIR=$HOME/reports/jest npm run test:ci -- \
              --reporters=default --reporters=jest-junit --coverageThreshold='{}'
            cp coverage/coverage-final.json ~/shard/coverage-$CIRCLE_NODE_INDEX.json
      - persist_to_workspace:
          root: ~/shard
          paths: [.]
      - codecov/upload
      - store_test_results:
          path: ~/reports
      - store_artifacts:
          path: ~/reports
