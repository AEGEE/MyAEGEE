          path: ~/reports
  statutory-build:
    docker:
      - image: cimg/base:2025.12
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run: docker-compose -f statutory/docker/docker-compose.yml -f statutory/docker/docker-compose.dev.yml build --no-cache statutory
  statutory-eslint:
    docker:
      - image: cimg/node:22.22.0
    resource_class: large
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/statutory
          override-ci-command: npm ci --legacy-peer-deps
      - run: mkdir -p ~/reports
      - run:
          name: Run statutory eslint
          working_directory: ~/project/statutory
          command: npm run lint -- --format junit --output-file ~/reports/eslint.xml
      - store_test_results:
          path: ~/reports
      - store_artifacts:
          path: ~/reports
  statutory-audit:
    docker:
      - image: cimg/node:22.22.0
    resource_class: large
    steps:
      - checkout
      - run:
          name: Run statutory audit
          working_directory: ~/project/statutory
          command: npm audit --production
      - slack/notify:
          event: fail
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: The audit check for statutory module in `$CIRCLE_PROJECT_REPONAME` has failed."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*\n$CIRCLE_PROJECT_REPONAME"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job Number*\n$CIRCLE_BUILD_NUM"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Visit Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }
  statutory-docker-build-and-push:
    docker:
      - image: cimg/node:22.22.0
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Install monorepo workspace dependencies
          command: npm install --ignore-scripts
      - run:
          name: Run semantic-release for statutory
          working_directory: ~/project/statutory
          command: npm run semantic-release
      - run:
          name: Set up Docker Buildx for multi-platform builds
          command: |
            docker buildx create --name multiarch --use
            docker buildx inspect --bootstrap
      - run:
          name: Build and push statutory Docker image (multi-platform)
          working_directory: ~/project/statutory
          command: |
