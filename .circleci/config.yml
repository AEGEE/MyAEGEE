orbs:
  shellcheck: circleci/shellcheck@3.4.0
  docker: circleci/docker@2.8.2
version: 2.1
jobs:
  yamllint:
    docker:
      - image: cimg/python:3.13.6
    steps:
      - checkout
      - run: pip install yamllint
      - run: yamllint -d .yamllint.yml .
  pylint:
    docker:
      - image: cimg/python:3.13.6
    steps:
      - checkout
      - run: pip install pylint
      # FIXME: enable W0511 and E0401 as well
      - run: pylint scripts-server --disable C0114,C0116,W0511,E0401
  hadolint:
    docker:
      - image: hadolint/hadolint:latest-alpine
    steps:
      - checkout
      - run:
          name: Lint Dockerfiles
          command: hadolint $(find . -name '*Dockerfile*')
  shellcheck:
    docker:
      - image: cimg/base:2025.08
    steps:
      - checkout
      - shellcheck/install
      - shellcheck/check:
          exclude: SC2002,SC2086,SC2126,SC2154
  test-setup-scripts:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Install bats
          command: |
            sudo apt-get update
            sudo apt-get install -y bats
      - run:
          name: Run setup script tests
          command: |
            if [ -d tests/setup ] && ls tests/setup/*.bats 1> /dev/null 2>&1; then
              bats tests/setup/*.bats
            else
              echo "No bats tests found yet, skipping"
            fi
      - run:
          name: Lint setup scripts
          command: |
            if [ -d scripts-ubuntu ] && ls scripts-ubuntu/*.sh 1> /dev/null 2>&1; then
              sudo apt-get install -y shellcheck
              find scripts-ubuntu/ -name "*.sh" -exec shellcheck {} +
            else
              echo "No setup scripts found yet, skipping"
            fi
workflows:
  lint-yaml:
    jobs:
      - yamllint
  lint-shell:
    jobs:
      - shellcheck
  lint-python:
    jobs:
      - pylint
  lint-dockerfile:
    jobs:
      - hadolint
  test-setup:
    jobs:
      - test-setup-scripts
