    machine:
      image: ubuntu-2404:2026.10.1
    environment:
      MIX_ENV: test
      SMTP_USER: mailer@aegee.eu
      SMTP_NAME: AEGEE <mailer@aegee.eu>
      SMTP_PASSWORD: 5ecr3t
      SMTP_HOST: mail.aegee.eu
    resource_class: large
    steps:
      - checkout
      - run:
          # Run in the image the mailer is deployed with (mailer/docker/mailer/Dockerfile).
          # coveralls.multiple writes cover/lcov.info and fails below the minimum in
          # mailer/coveralls.json.
          name: Run mailer tests in elixir:1.20-alpine
          working_directory: ~/project/mailer
          command: |
            docker run --rm -v "$PWD":/app -w /app \
              -e MIX_ENV -e SMTP_USER -e SMTP_NAME -e SMTP_PASSWORD -e SMTP_HOST \
              elixir:1.20-alpine@sha256:a2f0fe1bfd8a2f9cc91d913f4a12e6430e27e618720f753a514e2fff3d35f5a7 sh -c '
                apk add --no-cache git make gcc g++ &&
                mix local.hex --force &&
                mix local.rebar --force &&
                mix deps.get --locked &&
                mix coveralls.multiple --type lcov --type local'
      - codecov/upload:
          files: mailer/cover/lcov.info
          flags: mailer
