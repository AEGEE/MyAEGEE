orbs:
  codecov: codecov/codecov@6.1.0
  node: circleci/node@7.2.1
  shellcheck: circleci/shellcheck@3.5.1
  slack: circleci/slack@6.1.3
version: 2.1
commands:
  semantic-release:
    description: >-
      Run semantic-release for a service as the AEGEE release GitHub App, not a
      personal account. Needs GITHUB_APP_ID and GITHUB_APP_PRIVATE_KEY from
      the myaegee-release-bot context.
    parameters:
      service:
        type: string
    steps:
      - run:
          name: Run semantic-release for << parameters.service >>
          working_directory: ~/project/<< parameters.service >>
          command: |
            # semantic-release reads GH_TOKEN before GITHUB_TOKEN for the API and
            # GIT_CREDENTIALS first for git push. Set all three so an old project
            # variable can't win. Git needs the x-access-token: user for an App token.
            GH_TOKEN="$(node ../.circleci/github-app-token.mjs)"
            export GH_TOKEN GITHUB_TOKEN="${GH_TOKEN}" GIT_CREDENTIALS="x-access-token:${GH_TOKEN}"
            npm run semantic-release
jobs:
  yamllint:
    docker:
      - image: cimg/python:3.15.2
    steps:
      - checkout
      - run: pip install yamllint
      - run: yamllint -d .yamllint.yml .
  pylint:
    docker:
      - image: cimg/python:3.15.2
    steps:
      - checkout
      - run: pip install pylint
      # FIXME: enable W0511 and E0401 as well
      - run: pylint scripts-server --disable C0114,C0116,W0511,E0401
  dispatcher-ruff:
    docker:
      - image: cimg/python:3.15.2
    steps:
      - checkout
      - run:
          name: Run dispatcher ruff
          working_directory: ~/project/dispatcher
          command: |
            pip install ruff
            ruff check .
  dispatcher-test:
    docker:
      - image: cimg/python:3.15.2
    steps:
      - checkout
      - run:
          name: Run dispatcher tests
          working_directory: ~/project/dispatcher
          command: |
            pip install poetry
            poetry install --with dev
            poetry run pytest
      # pytest writes coverage.xml and fails below the threshold in pyproject.toml.
      - codecov/upload:
          files: dispatcher/coverage.xml
          flags: dispatcher
  hadolint:
    docker:
      - image: hadolint/hadolint:latest-alpine
    steps:
      - checkout
      - run:
          name: Lint Dockerfiles
          command: hadolint $(find . -name '*Dockerfile*' -not -path './mailer/*')
  shellcheck:
    docker:
      - image: cimg/base:2026.11
    steps:
      - checkout
      - shellcheck/install
      - run:
          name: Run shellcheck
          command: |
            shellcheck --exclude=SC2002,SC2086,SC2126,SC2154 $(find . -name '*.sh' -not -path '*/node_modules/*' -not -path './mailer/*' -type f)
  openapi:
    # Lints the services' OpenAPI files, checks the generated types in packages/api-types,
    # and tests and lints the shared helpers (docs/testing/backend-openapi.md).
    docker:
      - image: cimg/node:26.13.1
    steps:
      - checkout
      # Only the root tools and two workspaces: core provides ajv, yaml, express, eslint and
      # istanbul-lib-coverage to the helpers and their tests, e2e provides the TypeScript that
      # openapi-typescript needs. Half the download of all nine workspaces. Own cache-version,
      # because the e2e job caches the full install of the same lockfile.
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project
          cache-version: openapi-v1
          override-ci-command: npm ci --legacy-peer-deps --workspace core --workspace e2e --include-workspace-root
      - run:
          name: Lint the OpenAPI files
          command: npx redocly lint
      - run:
          name: Check the OpenAPI files against the service conventions (closed schemas, no Todo)
          command: node packages/backend-test-utils/spec-lint.js
      - run:
          # Generates the types and fails on any difference to the committed files.
          # openapi-typescript --check stops at the first API in redocly.yaml that is up to date.
          name: Check that the generated types are up to date
          command: npm run openapi:types:check
      - run:
          name: Test the shared backend test helpers
          command: node --test packages/backend-test-utils/test/
      - run:
          name: Lint the shared backend test helpers
          command: npx eslint packages/backend-test-utils
      - run:
          name: Check codecov.yml after_n_builds against the uploads
          command: node packages/backend-test-utils/check-codecov-builds.js
      - run:
          name: Check that no coverage ratchet was lowered without a Coverage-lowered trailer
          command: |
            git fetch --quiet origin stable
            node packages/backend-test-utils/check-coverage-lowered.js core statutory events summeruniversity network discounts mailer dispatcher
  core-test:
    docker:
      - image: cimg/node:26.13.1
      - image: cimg/postgres:18.7
        environment:
          POSTGRES_PASSWORD: config.test.postgres.password
    parallelism: 4
    resource_class: large
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/core
          override-ci-command: npm ci --legacy-peer-deps
      - run: mkdir -p ~/reports/jest
      - run:
          name: Run core tests
          working_directory: ~/project/core
          command: |
            mkdir -p ~/shard
            TEST=$(circleci tests glob "test/**/*.test.js" | circleci tests split --split-by=timings)
            OPENAPI_HITS_FILE=$HOME/shard/openapi-hits-$CIRCLE_NODE_INDEX.txt \
            JEST_JUNIT_OUTPUT_DIR=$HOME/reports/jest npm run test:ci $TEST -- \
              --reporters=default --reporters=jest-junit --coverageThreshold='{}'
            cp coverage/coverage-final.json ~/shard/coverage-$CIRCLE_NODE_INDEX.json
      - persist_to_workspace:
          root: ~/shard
          paths: [.]
      - codecov/upload
      - store_test_results:
          path: ~/reports
      - store_artifacts:
          path: ~/reports
  core-coverage:
    # The shards of core-test together: the coverage ratchet of core/package.json, and every
    # response that core/openapi.yaml documents has a test (docs/testing/backend-openapi.md).
    docker:
      - image: cimg/node:26.13.1
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/core
          override-ci-command: npm ci --legacy-peer-deps
      - attach_workspace:
          at: ~/shard
      - run: node packages/backend-test-utils/check-coverage.js core --expect 4 ~/shard/coverage-*.json
      - run: node packages/backend-test-utils/unexercised.js core ~/shard/openapi-hits-*.txt
      - run:
          name: Every coverage ignore has a reason
          command: "! grep -rnE 'istanbul ignore (next|if|else|file) *(\\*/|$)' core/lib core/models core/middlewares"
  core-db-recreate:
    docker:
      - image: cimg/node:26.13.1
      - image: cimg/postgres:18.7
        environment:
          POSTGRES_PASSWORD: config.test.postgres.password
    resource_class: large
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/core
          override-ci-command: npm ci --legacy-peer-deps
      - run:
          name: Run core db:recreate
          working_directory: ~/project/core
          command: NODE_ENV=test npm run db:recreate
  core-build:
    docker:
      - image: cimg/base:2026.11
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run: docker-compose -f core/docker/docker-compose.yml -f core/docker/docker-compose.dev.yml build --no-cache core
  core-eslint:
    docker:
      - image: cimg/node:26.13.1
    resource_class: large
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: ~/project/core
          override-ci-command: npm ci --legacy-peer-deps
      - run: mkdir -p ~/reports
      - run:
          name: Run core eslint
          working_directory: ~/project/core
          command: npm run lint -- --format junit --output-file ~/reports/eslint.xml
      - store_test_results:
          path: ~/reports
      - store_artifacts:
          path: ~/reports
  core-audit:
    docker:
      - image: cimg/node:26.13.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: Run core audit
          working_directory: ~/project/core
          command: npm audit --production
      - slack/notify:
          event: fail
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: The audit check for core module in `$CIRCLE_PROJECT_REPONAME` has failed."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*\n$CIRCLE_PROJECT_REPONAME"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job Number*\n$CIRCLE_BUILD_NUM"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Visit Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }
  core-docker-build-and-push:
    docker:
      - image: cimg/node:26.13.1
    resource_class: large
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Install monorepo workspace dependencies
          command: npm install --ignore-scripts
      - semantic-release:
          service: core
      - run:
          name: Set up Docker Buildx for multi-platform builds
          command: |
            docker buildx create --name multiarch --use
            docker buildx inspect --bootstrap
      - run:
          name: Export PACKAGE_VERSION for core
          command: |
            PACKAGE_VERSION="$(.circleci/package-version.sh core)"
            echo "export PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$BASH_ENV"
      - run:
          name: Build and push core Docker image (multi-platform)
          working_directory: ~/project/core
          command: |
            printf '%s\n' "$DOCKER_PASSWORD" | docker login --username "$DOCKER_LOGIN" --password-stdin
            # TODO: re-enable provenance and sbom once Docker has been updated
            docker buildx build --provenance=false --sbom=false --platform linux/amd64,linux/arm64 \
              --build-arg PACKAGE_VERSION=$PACKAGE_VERSION \
              --tag aegee/core:$PACKAGE_VERSION \
              --tag aegee/core:latest \
              -f docker/core/Dockerfile \
              --output type=registry,oci-mediatypes=false .
      - slack/notify:
          event: pass
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: The Docker image for core module with tags `$PACKAGE_VERSION` and `latest` has been pushed to Dockerhub."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*\n$CIRCLE_PROJECT_REPONAME"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job Number*\n$CIRCLE_BUILD_NUM"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Visit Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }
      - slack/notify:
          event: fail
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":octagonal_sign: The Docker image for core module build and push has failed."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*\n$CIRCLE_PROJECT_REPONAME"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job Number*\n$CIRCLE_BUILD_NUM"
