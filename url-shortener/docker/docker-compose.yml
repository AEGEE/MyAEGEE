version: "3.4"
services:
  # nginx-yourls: #could be that it has some cachet bullshit still
  #   image: aegee/nginx-webserver:latest
  #   restart: always
  #   environment:
  #     PHPFPM_HOST: "yourls"
  #   depends_on:
  #     - yourls
  #   labels:

  yourls:
    restart: on-failure
    image: yourls:1.7
#       image: yourls:1.7-fpm-alpine
    environment:
      YOURLS_DB_HOST: "maria-yourls"
      YOURLS_DB_USER: "yourls"
      YOURLS_DB_PASS: "${PW_YOURLS}"
      YOURLS_SITE: "https://${SUBDOMAIN_SHORTENER}${SHORTENER_DOMAIN}"
      YOURLS_USER: "admin"
      YOURLS_PASS: "${PW_YOURLS}"
      YOURLS_PRIVATE: "true"
  maria-yourls:
    image: mariadb:10.4
    restart: always
    environment:
      MYSQL_DATABASE: "yourls"
      MYSQL_USER: "yourls"
      MYSQL_PASSWORD: "${PW_YOURLS}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - maria-yourls:/var/lib/mysql

volumes:
  maria-yourls:
    driver: local

networks:
  default:
    name: OMS
