version: "3.4"

services:

### container administration helper Container #######################################
  # This is not meant to use in prod! only in local env for newbies
  # To get the password (hashed): (also remember to escape $ with another $)
  #   docker run --rm httpd:2.4-alpine htpasswd -nbB admin 5ecr3t | cut -d ":" -f 2
  portainer:
    restart: "no"
    image: portainer/portainer:1.25.0
    # image: portainer/portainer-ce:2.15.0
    command: -H unix:///var/run/docker.sock --admin-password ${PW_TRAEFIK} --logo ${AEGEE_LOGO_B64}  # yamllint disable-line rule:line-length
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # - portainer-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.backend=portainer"
      - "traefik.port=9000"
      - "traefik.frontend.rule=Host:${SUBDOMAIN_PORTAINER}${BASE_URL}"
      - "traefik.frontend.priority=20"

### DB admin (UIs) Containers #######################################

### pg Admin Container #######################################
  pgadmin:
    image: dpage/pgadmin4:9.19
    restart: on-failure
    expose:
      - "5050"
    labels:
      - "traefik.enable=true"
      - "traefik.backend=pgadmin"
      - "traefik.port=5050"
      - "traefik.frontend.rule=Host:${SUBDOMAIN_PGADMIN}${BASE_URL}"
      - "traefik.frontend.priority=20"
      - "traefik.frontend.auth.basic.users=admin:${PW_TRAEFIK}"
    environment:
      PGADMIN_DEFAULT_EMAIL: "myaegee-admins@${EMAIL_DOMAIN}"
      PGADMIN_DEFAULT_PASSWORD: "${PW_PGADMIN}"
      PGADMIN_LISTEN_PORT: 5050

### show api docs Container #######################################
  swagger:
    image: swaggerapi/swagger-ui:v5.36.0
    # Reads each service's openapi.yaml from the checkout (docs/testing/backend-openapi.md).
    # The pull request that writes a service's spec adds its two lines, in alphabetical order:
    #   volumes:  - ./<service>/openapi.yaml:/usr/share/nginx/html/specs/<service>.yaml:ro
    #   URLS:     {url: './specs/<service>.yaml', name: '<service>'}
    # For reading only: "Try it out" cannot reach the APIs from this host.
    volumes:
      - ./core/openapi.yaml:/usr/share/nginx/html/specs/core.yaml:ro
      - ./discounts/openapi.yaml:/usr/share/nginx/html/specs/discounts.yaml:ro
      - ./network/openapi.yaml:/usr/share/nginx/html/specs/network.yaml:ro
      - ./events/openapi.yaml:/usr/share/nginx/html/specs/events.yaml:ro
      - ./summeruniversity/openapi.yaml:/usr/share/nginx/html/specs/summeruniversity.yaml:ro
      - ./statutory/openapi.yaml:/usr/share/nginx/html/specs/statutory.yaml:ro
    environment:
      URLS: "[{url: './specs/core.yaml', name: 'core'}, {url: './specs/discounts.yaml', name: 'discounts'}, {url: './specs/network.yaml', name: 'network'}, {url: './specs/events.yaml', name: 'events'}, {url: './specs/summeruniversity.yaml', name: 'summeruniversity'}, {url: './specs/statutory.yaml', name: 'statutory'}]"
    labels:
      - traefik.enable=true
      - traefik.backend=swagger
      - traefik.port=8080
      - traefik.frontend.rule=Host:${SUBDOMAIN_APIDOCS}${BASE_URL}
      - traefik.frontend.priority=20

volumes:
  portainer-data:
    driver: local

networks:
  default:
    external:
      name: OMS
