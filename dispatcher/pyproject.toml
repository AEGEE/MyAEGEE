[tool.poetry]
name = "dispatcher"
version = "0.1.0"
description = "Polls rabbitMQ and takes action"
authors = ["linuxbandit <bellicaf@tcd.ie>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pika = "^1.3.2"
jinja2 = "^3.1.6"


[tool.poetry.group.dev.dependencies]
faker = "^37.0"
pytest = "^9.0"
ruff = "^0.11"
pytest-cov = "^7.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 (line too long) is deferred — fix in a dedicated formatting pass.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# send.py is a manual test helper, not production code.
# E275: missing whitespace after keyword — triggered by the if(CONDITION) style used there.
"helpers/send.py" = ["E275"]

[tool.pytest.ini_options]
# Coverage ratchet: the threshold is the coverage reached, floored to one decimal. Raise it
# when coverage goes up; lowering it needs an approved `Coverage-lowered: dispatcher: <why>`
# commit trailer (packages/backend-test-utils/check-coverage-lowered.js, in CI).
addopts = "--cov=dispatcher --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
