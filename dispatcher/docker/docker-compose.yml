services:

  rabbit:
    image: rabbitmq:4-management
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    expose:
      - 5672
      - 15672
    environment:
      # Defaults to guest/guest so the dev stack works without a .env file.
      # In production set RABBITMQ_USER and RABBITMQ_PASS to non-default values.
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-guest}"
    labels:
      - "traefik.frontend.rule=Host:${SUBDOMAIN_RABBITMQ}${BASE_URL};PathPrefix:/"
      - "traefik.backend=rabbit"
      - "traefik.port=15672"
      - "traefik.enable=true"

  # Not a webservice, but a worker service
  dispatcher:
    image: aegee/dispatcher
    restart: always
    depends_on:
      rabbit:
        condition: service_healthy
    environment:
      ENV: "${MYAEGEE_ENV}"
      EMAIL_HOST: "${ETHEREAL_SMTP_HOST}"
      EMAIL_PORT: "${ETHEREAL_PORT}"
      EMAIL_ADDRESS: "${ETHEREAL_USER}"
      EMAIL_PASSWORD: "${ETHEREAL_PW}"
      NOTIFY_CHANNEL: "slack-tests-programmatic-stuff-other"
      RABBITMQ_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_PASS: "${RABBITMQ_PASS:-guest}"
    volumes:
      - ./secrets/tokens.json:/usr/app/tokens.json


networks:
  default:
    external:
      name: OMS
