# Development: retry a failed start a few times (e.g. one before the database is
# ready), but don't crash-loop forever or start again on every boot. Production
# keeps the restart policies of docker-compose.yml.
services:

  rabbit:
    restart: on-failure:10
    image: rabbitmq:4-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  dispatcher:
    restart: on-failure:10
    build:
      context: ./${PATH_DISPATCHER}/..
      dockerfile: ./docker/Dockerfile
    image: aegee/dispatcher:dev
    depends_on:
      rabbit:
        condition: service_healthy
    volumes:
      - ./${PATH_DISPATCHER}/../templates:/usr/app/templates:ro
      - ./${PATH_DISPATCHER}/../dispatcher:/usr/app/src:ro

  mailpit:
    restart: on-failure:10
    image: axllent/mailpit:v1.29
    ports:
      - 8025:8025
      - 1025:1025
    labels:
      - "traefik.frontend.rule=Host:${SUBDOMAIN_MAILPIT}${BASE_URL};"
      - "traefik.backend=mailpit"
      - "traefik.port=8025"
      - "traefik.enable=true"
