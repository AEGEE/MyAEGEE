        local_experience: {type: string}
        attended_agorae: {type: string}
        attended_epm: {type: string}
        attended_conferences: {type: string}
        external_experience: {type: string}
        related_experience: {type: string}
        motivation: {type: string}
        program: {type: string}
        agreed_to_privacy_policy: {type: boolean}
        status: {$ref: '#/components/schemas/CandidateStatus'}
        image_id: {type: [integer, 'null']}
