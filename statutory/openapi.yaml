            application/json:
              schema: {$ref: '#/components/schemas/ApplicationWithPermissionsResponse'}
        '400': {$ref: '#/components/responses/PathUnreadable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateApplication
      summary: Edit an application
      description: |
        Only the fields of the application form are stored; the name, gender and date of
        birth are refreshed from the applicant's core profile. A new body clears the
        participant type, order and board comment. The applicant and the board of the body
        get a mail; when a mail fails, nothing is changed.

        403 is also the answer when the applicant is not a member of the new `body_id`, or
        when that body may not send any participants.
      tags: [applications]
      x-permission: 'the applicant while the application is not accepted and the application period is open (or with global:apply:<type>), or global:manage_applications:<type>'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationUpdateInput'}
      responses:
