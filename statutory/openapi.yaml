  /events/{event_id}/applications/{application_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplication
      summary: One application
      description: |
        The application with what the caller may do with it (`permissions`) and the bodies
        the applicant could apply from (`editable_bodies`, empty unless the caller may edit
        the application). Three shapes:

        - the whole application, for those who manage applications, those who approve the
          members of all bodies and the board of the applicant's body;
        - the whole application without `board_comment`, for the applicant;
        - the fields of the local organisers' list, for those who only hold
          `manage_incoming`, and only for accepted applications that are not cancelled
          (others answer 404).

        `status` reads `pending` until the event reveals the statuses, unless the caller
        manages the applications.
      tags: [applications]
      x-permission: 'the applicant, global:manage_applications:<type>, global:approve_members:<type> or approve_members:<type> in the applicant''s body, or global:manage_incoming:<type>'
      responses:
        '200':
