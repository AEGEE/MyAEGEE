    DateInput:
      description: A day (`2031-07-01`) or a full timestamp with its time zone (`2031-07-01T10:00:00.000Z`). Anything else is refused.
      anyOf:
        - {type: string, format: date}
        - {type: string, format: date-time}
    IntegerInput:
      description: A whole number, or a string of digits, which is stored as a number.
      type: [integer, string]
      minimum: 0
      pattern: '^[0-9]+$'
    EventCreateInput:
      description: |
        The dates are anything JavaScript reads as a date; the frontend sends ISO 8601. An
        Agora also needs the members list, proposal, candidature and booklet deadlines.
      type: object
      required:
        - name
        - url
        - description
        - type
        - body_id
        - starts
        - ends
        - application_period_starts
        - application_period_ends
        - board_approve_deadline
        - participants_list_publish_deadline
        - questions
        - fee
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        url: {type: string, pattern: '^[a-zA-Z0-9-]+$', maxLength: 255}
        description: {type: string, minLength: 1}
        type: {$ref: '#/components/schemas/EventType'}
        body_id: {$ref: '#/components/schemas/IntegerInput'}
        starts: {$ref: '#/components/schemas/DateInput'}
        ends: {$ref: '#/components/schemas/DateInput'}
        application_period_starts: {$ref: '#/components/schemas/DateInput'}
        application_period_ends: {$ref: '#/components/schemas/DateInput'}
        board_approve_deadline: {$ref: '#/components/schemas/DateInput'}
        participants_list_publish_deadline: {$ref: '#/components/schemas/DateInput'}
        application_status_revealed_at: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        memberslist_submission_deadline: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        draft_proposal_deadline: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        final_proposal_deadline: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        candidature_deadline: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        booklet_publication_deadline: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        updated_booklet_publication_deadline: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        booklet_folder: {type: [string, 'null'], maxLength: 255}
        locations: {type: array, items: {$ref: '#/components/schemas/EventLocationInput'}}
        questions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EventQuestionInput'}}
        fee: {type: [number, string]}
        vegetarian: {type: boolean}
      additionalProperties: true
    EventUpdateInput:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        url: {type: string, pattern: '^[a-zA-Z0-9-]+$', maxLength: 255}
        description: {type: string, minLength: 1}
