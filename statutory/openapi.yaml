              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
        '400':
          description: The event is not an Agora, or the filter names a field or value that is not supported.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
