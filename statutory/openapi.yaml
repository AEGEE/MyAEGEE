    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PositionId'
      - $ref: '#/components/parameters/CandidateId'
      - name: image
        in: path
        required: true
        description: Any value; the frontend sends `image`. The route takes this segment as a parameter and does not look at it.
        schema: {type: string}
    post:
      operationId: uploadCandidateImage
      summary: Upload the image of a candidature
      description: Replaces the image the candidature had and removes the old file.
      tags: [candidates]
      x-permission: 'the candidate while the candidature is pending, or global:manage_candidates:agora'
      requestBody:
        $ref: '#/components/requestBodies/ImageUpload'
      responses:
        '200':
          description: The candidature with its new image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateWithImageResponse'}
        '400': {$ref: '#/components/responses/NotAgoraOrBadId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: No image, a file over 5 MB, another extension than .png, .jpg or .jpeg, or content that is not such an image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /events/{event_id}/positions/{position_id}/candidates/{candidate_id}/status:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PositionId'
      - $ref: '#/components/parameters/CandidateId'
    put:
      operationId: setCandidatureStatus
      summary: Approve or reject a candidature
      description: Without `status` in the body nothing changes.
      tags: [candidates]
      x-permission: global:manage_candidates:agora
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateStatusInput'}
      responses:
        '200':
          description: The candidature.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateWithImageResponse'}
        '400': {$ref: '#/components/responses/NotAgoraOrBadId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /events/{event_id}/plenaries:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listPlenaries
      summary: List the plenaries of an Agora
      tags: [plenaries]
      x-permission: global:see_plenaries:agora or global:manage_plenaries:agora
      responses:
        '200':
          description: The plenaries, the oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlenaryListResponse'}
        '400': {$ref: '#/components/responses/NotAgora'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createPlenary
      summary: Add a plenary
      description: The attendances that are still open are closed when the plenary ends.
      tags: [plenaries]
      x-permission: global:manage_plenaries:agora
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlenaryCreateInput'}
      responses:
        '200':
          description: The created plenary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlenaryResponse'}
        '400': {$ref: '#/components/responses/NotAgora'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /events/{event_id}/plenaries/stats:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: exportPlenaryStats
      summary: Export the attendance of the plenaries as a spreadsheet
      description: One sheet for the delegates, one for the bodies and one per plenary.
      tags: [plenaries]
      x-permission: global:see_plenaries:agora or global:manage_plenaries:agora
      responses:
        '200':
          description: The file `plenary.xlsx`.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
        '400': {$ref: '#/components/responses/NotAgora'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/plenaries/{plenary_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PlenaryId'
    put:
      operationId: updatePlenary
      summary: Edit a plenary
      tags: [plenaries]
      x-permission: global:manage_plenaries:agora
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlenaryUpdateInput'}
      responses:
        '200':
          description: The edited plenary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlenaryResponse'}
        '400': {$ref: '#/components/responses/NotAgoraOrBadId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    get:
      operationId: getPlenary
      summary: One plenary with its attendances
      description: The latest attendance first, each with a few fields of the application. The permission is checked before the id.
      tags: [plenaries]
      x-permission: global:see_plenaries:agora or global:manage_plenaries:agora
      responses:
        '200':
          description: The plenary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlenaryWithAttendancesResponse'}
        '400': {$ref: '#/components/responses/NotAgoraOrBadId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/plenaries/{plenary_id}/attendance/mark:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/PlenaryId'
    post:
      operationId: markPlenaryAttendance
      summary: Mark a delegate or envoy as entering or leaving a plenary
      description: |
        Closes the open attendance of the application at this plenary, or starts one when
        none is open. Attendance can be marked from before the plenary starts until the
        moment it ends, that moment included; an attendance that is still open then is
        closed by the service. A member has at most one open attendance at a plenary: a mark
        that meets another mark of the same member answers with the attendance that one
        opened. 403 is also the answer when the plenary is over, when the applicant is not a
        delegate or an envoy, and when the application is not accepted or is cancelled. 404 is also the answer when the event has
        no such application. 422 is the answer when the attendance would end at the moment
        it started.
      tags: [plenaries]
      x-permission: global:mark_attendance:agora
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceMarkInput'}
      responses:
        '200':
          description: The attendance that was started or closed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttendanceWithApplicationResponse'}
        '400': {$ref: '#/components/responses/NotAgoraOrBadId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
components:
  securitySchemes:
    XAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Access token issued by core. Other services check it against core on every request.
  parameters:
    Limit: {name: limit, in: query, description: 'A limit of 0 answers an empty page with the count of all rows.', schema: {type: integer, minimum: 0}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0}}
    ApplicationSort:
      name: sort
      in: query
      style: deepObject
      explode: true
      description: '`sort[field]` is one of the fields the list returns (default `id`; another field answers 400 "Sorting by this field is not supported."), `sort[order]` the direction (default `desc`). Each is one text, not a list.'
      schema:
        type: object
        properties:
          field: {type: string}
          order: {type: string, enum: [asc, desc]}
    ApplicationQuery:
      name: query
      in: query
      description: Part of the first name, the last name or the statutory id, case-insensitive.
      schema: {type: string}
    DisplayCancelled:
      name: displayCancelled
      in: query
      description: '`true` also lists the cancelled applications.'
      schema: {type: boolean}
    EventId:
      name: event_id
      in: path
      required: true
      description: |
        The id of the event when the value is a number, otherwise its `url`
        (case-insensitive). Four values pick the latest published event by start date:
        `latest`, `latest-agora`, `latest-epm` and `latest-spm`.
      schema: {type: [integer, string]}
    EventTypePath:
      name: event_type
      in: path
      required: true
      description: Any other value answers 400.
      schema: {$ref: '#/components/schemas/EventType'}
    BodyIdPath:
      name: body_id
      in: path
      required: true
      description: The id of a body in core.
      schema: {type: integer}
    ApplicationId:
      name: application_id
      in: path
      required: true
      description: |
        The id of the application when the value is all digits, `me` for the caller's own
        application to the event, otherwise the statutory id (`012-0034`).
      schema: {type: [integer, string]}
    PositionId:
      name: position_id
      in: path
      required: true
      description: The id of a position of the event that is not deleted. Anything but a number answers 400.
      schema: {type: integer}
    CandidateId:
      name: candidate_id
      in: path
      required: true
      description: The id of a candidature for the position. Anything but a number answers 400.
      schema: {type: integer}
    PlenaryId:
      name: plenary_id
      in: path
      required: true
      description: The id of a plenary of the event. Anything but a number answers 400.
      schema: {type: integer}
    QuestionLineId:
      name: question_line_id
      in: path
      required: true
      description: The id of a question line of the event. Anything but a number answers 400.
      schema: {type: integer}
    QuestionId:
      name: question_id
      in: path
      required: true
      description: The id of a question in the question line. Anything but a number answers 400.
      schema: {type: integer}
  requestBodies:
    ImageUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [image]
            properties:
              image:
                description: A .png, .jpg or .jpeg file of at most 5 MB.
                type: string
                contentMediaType: application/octet-stream
  responses:
    BadRequest: {description: 'Malformed request, for example a non-numeric ID.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    InvalidListQuery: {description: 'The list cannot be sorted by this field or in this order, or `limit` or `offset` is not a whole number.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotAgora: {description: 'The event is not an Agora.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotAgoraOrBadId: {description: 'The event is not an Agora, or an ID in the path is not a number.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: 'No token, or the token was rejected.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: 'Authenticated but not allowed (see x-permission).', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: 'A resource in the path does not exist.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    PathUnreadable: {description: 'The path has a broken percent encoding ("The path could not be read.").', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    UnreadableBody: {description: 'The body could not be read ("The request body could not be read." for a broken compression or a body nested more than 32 levels deep, "Invalid JSON." for text that is not JSON), holds a text or a key with characters that cannot be stored ("The request body contains characters that cannot be stored.": NUL, an unpaired surrogate), or is not an object ("The body should be an object."). Checked before the route, so also without a token.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BodyTooLarge: {description: 'The body is larger than 1 MB ("The request body could not be read."). Checked before the route.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BodyUnsupported: {description: 'The body is in a charset or a content encoding that is not supported ("The request body could not be read."). Checked before the route.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Busy: {description: 'Other requests held a lock on the same rows (the statutory IDs of the event, the votes of the body, the application) for longer than the lock timeout of 5 seconds, or Postgres ended the wait as a deadlock: "The server is busy, please try again." Nothing was changed.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationFailed: {description: 'Validation failed.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/ErrorWithMessage'
        - $ref: '#/components/schemas/ErrorWithFields'
    ErrorWithMessage:
      type: object
      required: [success, message]
      properties:
        success: {const: false}
        message: {type: string}
      additionalProperties: false
    ErrorWithFields:
      type: object
      required: [success, errors]
      properties:
        success: {const: false}
        errors:
          description: Keyed by field, or by the name of the rule for a rule that spans fields (`visaFieldsFilledIn`).
          type: object
          additionalProperties: {type: array, items: {type: string}}
      additionalProperties: false
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {const: true}
        message: {type: string}
      additionalProperties: false
    ListMeta:
      type: object
      required: [count]
      properties:
        count:
          description: The number of matches, whatever `limit` and `offset` are.
          type: integer
          minimum: 0
      additionalProperties: false
    Timestamps:
      type: object
      required: [created_at, updated_at]
      properties:
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Decimal:
      description: Sequelize DECIMAL. A string when read from Postgres, the input value right after create or update.
      type: [string, number]
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    HealthcheckResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: object
          required: [name, description, version]
          properties:
            name: {type: string}
            description: {type: string}
            version: {type: string}
          additionalProperties: false
      additionalProperties: false
    CoreBody:
      description: A body of the applicant as core returns it with a member, reduced to these keys.
      type: object
      required: [id, name, type, code]
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string}
        code: {type: string}
      additionalProperties: false
    BodySummary:
      type: object
      required: [id, name, type]
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string}
      additionalProperties: false
    BodySummaryListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/BodySummary'}}
      additionalProperties: false
    FieldNamesResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          description: Field name to column title.
          type: object
          additionalProperties: {type: string}
      additionalProperties: false
    Task:
      type: object
      required: [key, description, time, params, id]
      properties:
        key: {type: string, enum: [CLOSE_ATTENDANCES, OPEN_POSITION_APPLICATIONS, CLOSE_POSITION_APPLICATIONS]}
        description: {type: string}
        time:
          description: When the task runs.
          type: string
          format: date-time
        params:
          type: object
          required: [id]
          properties:
            id:
              description: The id of the plenary or the position.
              type: integer
          additionalProperties: false
        id: {type: integer}
      additionalProperties: false
    TaskMapResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          description: Keyed by task id.
          type: object
          additionalProperties: {$ref: '#/components/schemas/Task'}
      additionalProperties: false
    Image:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [id, file_name, frontend_path]
      properties:
        id: {type: integer}
        file_name: {type: string}
        frontend_path:
          description: '`/` and `file_name`; the frontend loads it from the images path of the gateway.'
          type: string
      unevaluatedProperties: false
    EventType:
      type: string
      enum: [agora, epm, spm]
    EventStatus:
      type: string
      enum: [draft, published]
    EventQuestion:
      description: One question of the application form. Events stored before the questions were checked can have a question without `required`, or with it as text.
      type: object
      required: [type, description]
      properties:
        type: {type: string, enum: [string, text, number, checkbox, select]}
        description: {type: string}
        required: {type: [boolean, string]}
        values:
          description: The options of a `select` question.
          type: array
          items: {type: string}
      additionalProperties: false
    EventLocation:
      description: Events stored before the locations were checked can have a location without a name.
      type: object
      required: [position]
      properties:
        name: {type: string}
        position:
          type: object
          required: [lat, lng]
          properties:
            lat: {type: number}
            lng: {type: number}
          additionalProperties: false
      additionalProperties: false
    EventFields:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required:
        - id
        - name
        - url
        - description
        - type
        - status
        - body_id
        - starts
        - ends
        - application_period_starts
        - application_period_ends
        - board_approve_deadline
        - participants_list_publish_deadline
        - application_status_revealed_at
        - memberslist_submission_deadline
        - draft_proposal_deadline
        - final_proposal_deadline
        - candidature_deadline
        - booklet_publication_deadline
        - updated_booklet_publication_deadline
        - publication_date
        - booklet_folder
        - locations
        - questions
        - fee
        - previous_agora_id
        - vegetarian
        - image_id
        - memberslist_edit_deadline
        - can_apply
        - can_approve_members
        - can_see_participants_list
        - can_upload_memberslist
        - can_edit_memberslist
      properties:
        id: {type: integer}
        name: {type: string}
        url:
          description: Lower case letters, digits and dashes, not digits only. Unique.
          type: string
        description: {type: string}
        type: {$ref: '#/components/schemas/EventType'}
        status: {$ref: '#/components/schemas/EventStatus'}
        body_id:
          description: The organising body.
          type: integer
        starts: {type: string, format: date-time}
        ends: {type: string, format: date-time}
        application_period_starts: {type: string, format: date-time}
        application_period_ends: {type: string, format: date-time}
        board_approve_deadline: {type: string, format: date-time}
        participants_list_publish_deadline: {type: string, format: date-time}
        application_status_revealed_at:
          description: When the statuses of the applications were shown to the applicants; null before that.
          type: [string, 'null']
          format: date-time
        memberslist_submission_deadline: {type: [string, 'null'], format: date-time}
        draft_proposal_deadline: {type: [string, 'null'], format: date-time}
        final_proposal_deadline: {type: [string, 'null'], format: date-time}
        candidature_deadline: {type: [string, 'null'], format: date-time}
        booklet_publication_deadline: {type: [string, 'null'], format: date-time}
        updated_booklet_publication_deadline: {type: [string, 'null'], format: date-time}
        publication_date: {type: [string, 'null'], format: date-time}
        booklet_folder: {type: [string, 'null']}
        locations: {type: array, items: {$ref: '#/components/schemas/EventLocation'}}
        questions: {type: array, items: {$ref: '#/components/schemas/EventQuestion'}}
        fee: {$ref: '#/components/schemas/Decimal'}
        previous_agora_id:
          description: The latest published Agora when this Agora was created.
          type: [integer, 'null']
        vegetarian:
          description: True refuses applications with the meal `Meat-eater`.
          type: boolean
        image_id: {type: [integer, 'null']}
        memberslist_edit_deadline:
          description: Fourteen days before `starts`.
          type: string
          format: date-time
        can_apply:
          description: Now is within the application period.
          type: boolean
        can_approve_members:
          description: Now is between the start of the application period and the board approve deadline.
          type: boolean
        can_see_participants_list:
          description: The participants list deadline has passed.
          type: boolean
        can_upload_memberslist:
          description: Now is between the start of the application period and the members list submission deadline.
          type: boolean
        can_edit_memberslist:
          description: Now is between the start of the application period and `memberslist_edit_deadline`.
          type: boolean
    Event:
      description: An event without its image, as returned right after it is created.
      type: object
      allOf:
        - $ref: '#/components/schemas/EventFields'
      unevaluatedProperties: false
    EventWithImage:
      type: object
      allOf:
        - $ref: '#/components/schemas/EventFields'
      required: [image]
      properties:
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
      unevaluatedProperties: false
    EventWithPermissions:
      type: object
      allOf:
        - $ref: '#/components/schemas/EventFields'
      required: [image, permissions]
      properties:
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
        permissions: {$ref: '#/components/schemas/EventPermissions'}
      unevaluatedProperties: false
    EventApplicationLink:
      description: The caller's application to the event.
      type: object
      required: [user_id, cancelled, status]
      properties:
        user_id: {type: integer}
        cancelled: {type: boolean}
        status: {$ref: '#/components/schemas/ApplicationStatus'}
      additionalProperties: false
    EventWithApplications:
      type: object
      allOf:
        - $ref: '#/components/schemas/EventFields'
      required: [applications]
      properties:
        applications: {type: array, items: {$ref: '#/components/schemas/EventApplicationLink'}}
      unevaluatedProperties: false
    RecentEvent:
      description: A grouped row, not an event.
      type: object
      required: [body_id, latest_event]
      properties:
        body_id: {type: integer}
        latest_event:
          description: The latest `ends` of the published events of the body.
          type: string
          format: date-time
      additionalProperties: false
    EventTypePermissions:
      type: object
      required: [agora, epm, spm]
      properties:
        agora: {type: boolean}
        epm: {type: boolean}
        spm: {type: boolean}
      additionalProperties: false
    GlobalPermission:
      type: object
      required: [global]
      properties:
        global: {type: boolean}
      additionalProperties: false
    BodyPermissions:
      description: '`global` for every body, and one key per body the caller is a member of, by body id.'
      type: object
      required: [global]
      properties:
        global: {type: boolean}
      additionalProperties: {type: boolean}
    EventPermissionsFields:
      description: What the caller may do with the event. For an anonymous caller every value is false, except `apply` and `see_participants_list`, which follow the dates of the event.
      type: object
