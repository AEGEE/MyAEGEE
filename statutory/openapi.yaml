openapi: 3.1.1
info:
  title: MyAEGEE statutory
  version: '1'
  description: |
    Statutory events of AEGEE-Europe (Agora, EPM, SPM): the events themselves, the
    applications of members and what boards, the Chair Team, the Juridical Commission and
    the local organisers do with them, members lists and the votes that follow from them,
    positions and candidatures, plenaries and their attendance, and question lines.

    Callers send a core access token in `X-Auth-Token`. The service checks it against core
    (`GET /members/me` and `GET /my_permissions`, and for every route under
    `/events/{event_id}` two `POST /my_permissions` calls) on every request. The health
    check and the metrics need no token, and the list of events, one event and the field
    names also answer anonymous callers.

    A draft event answers like an event that does not exist (404), unless the caller
    manages events of its type. A request with a rejected token for an event that does not
    exist answers 404 on the routes of the event itself, the votes, the plenaries, the
    positions and the candidatures, and 401 on the others: they check the token first.
  license: {name: ISC, identifier: ISC}
servers:
  - url: /api/statutory
security:
  - XAuthToken: []
tags:
  - name: general
  - name: events
  - name: applications
  - name: pax_limits
  - name: memberslists
  - name: massmailer
  - name: votes_amounts
  - name: positions
  - name: candidates
  - name: question_lines
  - name: questions
  - name: plenaries
paths:
  /healthcheck:
    get:
      operationId: getHealthcheck
      summary: Health check
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthcheckResponse'}
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics of the stored data
      description: Open in the service; the gateway puts basic authentication in front of it.
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /metrics/requests:
    get:
      operationId: getRequestMetrics
      summary: Prometheus metrics of the requests per endpoint
      description: Open in the service; the gateway puts basic authentication in front of it.
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /:
    get:
      operationId: listEvents
      summary: List the published events
      description: The latest event first. Drafts are never listed here.
      tags: [events]
      x-permission: none; anonymous callers get the same list
      security: [{}, {XAuthToken: []}]
      parameters:
        - name: search
          in: query
          description: Part of the name or the description, case-insensitive.
          schema: {type: string}
        - name: type
          in: query
          description: One event type, or several (`type[]=agora&type[]=epm`).
          schema:
            oneOf:
              - $ref: '#/components/schemas/EventType'
              - type: array
                items: {$ref: '#/components/schemas/EventType'}
        - name: starts
          in: query
          description: |
            Only events that start on or after this day (`YYYY-MM-DD`). The day is a day on
            the Central European calendar: it starts at midnight there.
          schema: {type: string, format: date}
        - name: ends
          in: query
          description: |
            Only events that end on or before this day (`YYYY-MM-DD`), until the last moment
            of that day in Central Europe. With `starts`, only events that lie between the
            two days as a whole.
          schema: {type: string, format: date}
      responses:
        '200':
          description: The published events with their images.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWithImageListResponse'}
        '400':
          description: '`starts` or `ends` is not a date.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      operationId: createEvent
      summary: Create an event
      description: |
        The event starts as a draft: `status`, `id` and `image_id` in the body are ignored.
        A new Agora gets the latest published Agora as `previous_agora_id`. The permission
        for the `type` is checked before the event is validated, so a `type` that is missing
        or not one of the three answers 403. An event that is created at or after its
        participants list deadline records that moment as `application_status_revealed_at`.
      tags: [events]
      x-permission: 'global:manage_event:<type>, for the type in the body'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventCreateInput'}
      responses:
        '200':
          description: The created event.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventResponse'}
        '400': {$ref: '#/components/responses/UnreadableBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tasks:
    get:
      operationId: listTasks
      summary: List the scheduled background tasks
      description: The tasks that open and close positions and close the attendances of a plenary.
      tags: [general]
      x-permission: global:see_background_tasks:statutory
      responses:
        '200':
          description: The scheduled tasks, keyed by task id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskMapResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /mine:
    get:
      operationId: listMyEvents
      summary: List the events the caller applied to
      description: |
        The earliest event first, each with the caller's application. Drafts are only listed
        for those who manage events of their type. The status of the application reads
        `pending` until the event reveals the statuses, unless the caller manages the
        applications of that event type.
      tags: [events]
      x-permission: authenticated (own applications only)
      responses:
        '200':
          description: The events with the caller's application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWithApplicationsListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /applications/future/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        description: The id of a member. Anything but digits within the Postgres integer range answers 400.
        schema: {type: integer, minimum: 0, maximum: 2147483647}
    get:
      operationId: listFutureApplications
      summary: List a member's applications to events that have not started
      description: |
        Used by core before it bans a member from applying. Only applications that are not
        cancelled or rejected, to published events that start in the future.
      tags: [applications]
      x-permission: 'global:update_application_ban:member, or global:manage_applications for any event type'
      responses:
        '200':
          description: The member's open applications, the earliest event first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FutureApplicationListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /recents:
    get:
      operationId: listRecentEvents
      summary: The end of the latest published event per organising body
      tags: [events]
      x-permission: authenticated
      parameters:
        - name: ends
          in: query
          description: |
            Only events that end on or before this day (`YYYY-MM-DD`), until the last moment
            of that day in Central Europe.
          schema: {type: string, format: date}
      responses:
        '200':
          description: One entry per organising body that has a published event.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecentEventListResponse'}
        '400':
          description: '`ends` is not a date.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /limits/{event_type}/defaults:
    parameters:
      - $ref: '#/components/parameters/EventTypePath'
    get:
      operationId: listDefaultPaxLimits
      summary: List the default participant limits of every body
      description: What each body may send by its type, without the limits stored for single bodies.
      tags: [pax_limits]
      x-permission: authenticated
      responses:
        '200':
          description: The default limit of every body in core.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaxLimitDefaultListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /limits/{event_type}/{body_id}:
    parameters:
      - $ref: '#/components/parameters/EventTypePath'
      - $ref: '#/components/parameters/BodyIdPath'
    get:
      operationId: getPaxLimit
      summary: The participant limit of one body
      description: The limit stored for the body, or the default for its type.
      tags: [pax_limits]
      x-permission: authenticated
      responses:
        '200':
          description: The limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaxLimitResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Core does not know the body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      operationId: deletePaxLimit
      summary: Remove the stored participant limit of a body
      description: The body falls back to the default for its type.
      tags: [pax_limits]
      x-permission: 'global:manage_event:<event_type>'
      responses:
        '200':
          description: The stored limit is removed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: The event type is not one of the three, or the body id is not a number.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No limit is stored for this body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /limits/{event_type}:
    parameters:
      - $ref: '#/components/parameters/EventTypePath'
    post:
      operationId: setPaxLimit
      summary: Store the participant limit of a body
      description: |
        Creates the limit of the body in the request for this event type, or changes the
        stored one. `id` and `event_type` in the body are ignored.
      tags: [pax_limits]
      x-permission: 'global:manage_event:<event_type>'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaxLimitInput'}
      responses:
        '200':
          description: The stored limit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaxLimitStoredResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    get:
      operationId: listPaxLimits
      summary: List the participant limits of every body
      description: For each body in core its stored limit, or the default for its type.
      tags: [pax_limits]
      x-permission: authenticated
      responses:
        '200':
          description: One limit per body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaxLimitListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getEvent
      summary: One event
      description: |
        The event with its image and what the caller may do with it (`permissions`). For an
        anonymous caller every permission that depends on the caller is false; `apply` and
        `see_participants_list` follow the dates of the event for everybody, so they are
        true in the application period and after the participants list deadline.
      tags: [events]
      x-permission: none; anonymous callers get the event with the permissions of somebody who may do nothing. A draft needs global:manage_event:<type>
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWithPermissionsResponse'}
        '400': {$ref: '#/components/responses/PathUnreadable'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateEvent
      summary: Edit an event
      description: |
        `id`, `type`, `status`, `image_id` and `application_status_revealed_at` in the body
        are ignored. The first edit at or after the participants list deadline (the stored
        one, not the one in the edit) records that moment as `application_status_revealed_at`.
      tags: [events]
      x-permission: 'global:manage_event:<type>'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventUpdateInput'}
      responses:
        '200':
          description: The edited event.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWithImageResponse'}
        '400': {$ref: '#/components/responses/UnreadableBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /events/{event_id}/fields/applications/all:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getApplicationFields
      summary: The names of the application fields
      description: |
        The column titles for the export of all applications, with one entry `answers.<n>`
        per question of the event.
      tags: [events]
      x-permission: none; anonymous callers get the same names
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: Field to title.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldNamesResponse'}
        '400': {$ref: '#/components/responses/PathUnreadable'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/fields/applications/incoming:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getIncomingApplicationFields
      summary: The names of the application fields for the local organisers
      tags: [events]
      x-permission: none; anonymous callers get the same names
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: Field to title.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldNamesResponse'}
        '400': {$ref: '#/components/responses/PathUnreadable'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/fields/candidates:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getCandidateFields
      summary: The names of the candidature fields
      tags: [events]
      x-permission: none; anonymous callers get the same names
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: Field to title.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FieldNamesResponse'}
        '400': {$ref: '#/components/responses/PathUnreadable'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/status:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      operationId: setEventStatus
      summary: Publish an event, or make it a draft again
      description: |
        Publishing sets `publication_date` to the moment of the request, also when the event
        is published already; making the event a draft leaves the date. A request without
        `status` (or with a status that is null, empty, 0 or false) answers 400 before the
        permission is checked.
      tags: [events]
      x-permission: 'global:manage_event:<type>'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventStatusInput'}
      responses:
        '200':
          description: The status is changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: The body has no `status`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /events/{event_id}/image:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: uploadEventImage
      summary: Upload the image of an event
      description: Replaces the image the event had and removes the old file.
      tags: [events]
      x-permission: 'global:manage_event:<type>'
      requestBody:
        $ref: '#/components/requestBodies/ImageUpload'
      responses:
        '200':
          description: The event with its new image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWithImageResponse'}
        '400': {$ref: '#/components/responses/PathUnreadable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: No image, a file over 5 MB, another extension than .png, .jpg or .jpeg, or content that is not such an image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /events/{event_id}/applications:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: submitApplication
      summary: Apply to an event
      description: |
        Only the fields of the application form are stored; the name, gender and date of
        birth come from the caller's core profile. The applicant and the board of the body
        get a mail; when a mail fails, the application is not stored.

        403 has several causes, each with its own message: the event is a draft, the
        application period is closed, the caller is banned from applying, the caller is not
        a member of `body_id`, or the body may not send any participants.

        The answer has no `board_comment`, unless the caller is one of those who select the
        participants of the body.
      tags: [applications]
      x-permission: authenticated, a member of the body, within the application period (or global:apply:<type> or global:manage_applications:<type>), and not banned from applying
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationCreateInput'}
      responses:
        '200':
          description: The application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationPresentedResponse'}
        '400': {$ref: '#/components/responses/UnreadableBody'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/BodyTooLarge'}
        '415': {$ref: '#/components/responses/BodyUnsupported'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/Busy'}
  /events/{event_id}/applications/all:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listApplications
      summary: List the applications of an event
      description: Whole applications, with the mail address of the applicant when core knows it.
      tags: [applications]
      x-permission: 'global:manage_applications:<type>'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ApplicationSort'
        - $ref: '#/components/parameters/ApplicationQuery'
        - $ref: '#/components/parameters/DisplayCancelled'
      responses:
        '200':
          description: The applications, the newest first unless sorted otherwise.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationListResponse'}
        '400': {$ref: '#/components/responses/InvalidListQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/applications/accepted:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listAcceptedApplications
      summary: The participants list
      description: The accepted applications that are not cancelled, by body, participant type and order.
      tags: [applications]
      x-permission: 'authenticated once the participants list deadline has passed; before that global:manage_applications:<type>'
      responses:
        '200':
          description: The participants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationParticipantListResponse'}
        '400': {$ref: '#/components/responses/PathUnreadable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/applications/juridical:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listJuridicalApplications
      summary: List the confirmed participants for the Juridical Commission
      description: The accepted and confirmed applications that are not cancelled.
      tags: [applications]
      x-permission: 'global:manage_juridical:<type> or global:manage_applications:<type>'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ApplicationSort'
        - $ref: '#/components/parameters/ApplicationQuery'
      responses:
        '200':
          description: The applications, the newest first unless sorted otherwise.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationJuridicalListResponse'}
        '400': {$ref: '#/components/responses/InvalidListQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/applications/incoming:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listIncomingApplications
      summary: List the participants for the local organisers
      description: The accepted applications that are not cancelled, with the mail address of the applicant when core knows it.
      tags: [applications]
      x-permission: 'global:manage_incoming:<type> or global:manage_applications:<type>'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ApplicationSort'
        - $ref: '#/components/parameters/ApplicationQuery'
      responses:
        '200':
          description: The applications, the newest first unless sorted otherwise.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationIncomingListResponse'}
        '400': {$ref: '#/components/responses/InvalidListQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/applications/network:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listNetworkApplications
      summary: List the applications for the Network Director
      description: The applications that are not cancelled, with whether the applicant is on the members list of the body.
      tags: [applications]
      x-permission: 'global:update_memberslist_status:<type> or global:manage_applications:<type>'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/ApplicationSort'
        - $ref: '#/components/parameters/ApplicationQuery'
      responses:
        '200':
          description: The applications, the newest first unless sorted otherwise.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationNetworkListResponse'}
        '400': {$ref: '#/components/responses/InvalidListQuery'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{event_id}/applications/stats:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getApplicationStats
      summary: Statistics of the applications of an event
      description: |
        Counts per day, body, participant type, gender, meal and number of events visited,
        and the bodies that count for the quorum. Until the event reveals the application
        statuses, every application that is not cancelled counts as pending, also for
        those who manage the applications.
      tags: [applications]
      x-permission: authenticated
      responses:
        '200':
          description: The statistics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationStatsResponse'}
