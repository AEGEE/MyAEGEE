      properties:
        email: {type: [string, 'null']}
        image:
          oneOf:
            - $ref: '#/components/schemas/Image'
            - type: 'null'
      unevaluatedProperties: false
    CandidateUpdated:
      description: A candidature in the answer to an edit.
      type: object
      allOf:
        - $ref: '#/components/schemas/CandidateFields'
      required: [body_id, email, image]
      properties:
        body_id: {type: integer}
