        applicants are on the list. `fee_paid` in the body is ignored.
      tags: [memberslists]
      x-permission: 'global:manage_memberslist:<type>, or manage_memberslist:<type> in that local before the deadline (after it with memberslist_late:<type>); between the submission and the edit deadline also global:edit_memberslist_between_deadlines:<type>'
