        updated_booklet_publication_deadline: {oneOf: [{$ref: '#/components/schemas/DateInput'}, {type: 'null'}]}
        booklet_folder: {type: [string, 'null'], maxLength: 255}
        locations: {type: array, items: {$ref: '#/components/schemas/EventLocationInput'}}
        questions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EventQuestionInput'}}
        fee: {type: [number, string]}
        vegetarian: {type: boolean}
      additionalProperties: true
    EventQuestionInput:
      description: A new or changed list of questions needs `required` as true or false in each (422 otherwise). The form sends the stored questions back, and an unchanged list is not checked, also when an older event stored a question without it.
      type: object
      required: [type, description]
      properties:
        type: {type: string, enum: [string, text, number, checkbox, select]}
        description: {type: string, minLength: 1}
        required: {type: [boolean, string]}
        values:
          description: Required for a `select` question.
          type: array
          items: {type: string, minLength: 1}
      additionalProperties: true
    EventLocationInput:
      description: A new or changed list of locations needs a name in each (422 otherwise); an unchanged list is not checked, also when an older event stored a location without a name.
      type: object
      required: [position]
      properties:
        name: {type: string, minLength: 1}
        position:
          type: object
          required: [lat, lng]
          properties:
            lat: {type: number}
            lng: {type: number}
          additionalProperties: true
      additionalProperties: true
