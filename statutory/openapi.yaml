    get:
      operationId: exportApplications
      summary: Export the applications as a spreadsheet
      description: |
        One row per application that is not cancelled, with the selected fields as columns.
        400 has three causes: another prefix than `all` or `incoming` (checked before the
        permission), no `select`, and a filter on a field or value that is not supported.
      tags: [applications]
      x-permission: 'all: global:manage_applications:<type>; incoming: global:manage_incoming:<type> or global:manage_applications:<type>'
      parameters:
        - name: select
          in: query
          required: true
          description: The fields to export, in column order (`select[]=first_name&select[]=last_name`). One field written without the brackets (`select=first_name`) is not read as a list and answers 400.
          schema: {type: array, items: {type: string}}
        - name: filter
          in: query
          style: deepObject
          explode: true
          description: Only applications with these values (`filter[status]=accepted`). Ignored for `incoming`.
          schema: {$ref: '#/components/schemas/ApplicationFilter'}
