        - user_id
        - body_name
        - position_id
        - first_name
        - last_name
        - date_of_birth
        - nationality
        - languages
        - studies
        - member_since
        - european_experience
        - local_experience
        - attended_agorae
        - attended_epm
        - attended_conferences
        - external_experience
        - related_experience
        - motivation
        - program
