# Local Docker Desktop config.
# Traefik v1.7 cannot use the Docker provider on Engine 29+ (API too old),
# so routes are declared here against Compose service DNS names.

logLevel = "INFO"
defaultEntryPoints = ["http"]

[entryPoints]
  [entryPoints.http]
  address = ":80"

[web]
address = ":8080"

[file]
  [frontends]
    [frontends.frontend]
    backend = "frontend"
    priority = 11
      [frontends.frontend.routes.main]
      rule = "Host:my.localhost;PathPrefix:/"

    [frontends.core]
    backend = "core"
    priority = 110
      [frontends.core.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/api/core"

    [frontends.core-old]
    backend = "core"
    priority = 110
      [frontends.core-old.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/services/oms-core-elixir/api"

    [frontends.core-static]
    backend = "core-static"
    priority = 110
      [frontends.core-static.routes.main]
      rule = "Host:my.localhost;PathPrefix:/media/core;PathPrefixStrip:/media/core"

    [frontends.events]
    backend = "events"
    priority = 110
      [frontends.events.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/api/events"

    [frontends.events-static]
    backend = "events-static"
    priority = 110
      [frontends.events-static.routes.main]
      rule = "Host:my.localhost;PathPrefix:/media/events;PathPrefixStrip:/media/events"

    [frontends.statutory]
    backend = "statutory"
    priority = 110
      [frontends.statutory.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/api/statutory"

    [frontends.statutory-static]
    backend = "statutory-static"
    priority = 110
      [frontends.statutory-static.routes.main]
      rule = "Host:my.localhost;PathPrefix:/media/statutory;PathPrefixStrip:/media/statutory"

    [frontends.network]
    backend = "network"
    priority = 110
      [frontends.network.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/api/network"

    [frontends.summeruniversity]
    backend = "summeruniversity"
    priority = 110
      [frontends.summeruniversity.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/api/summeruniversity"

    [frontends.summeruniversity-static]
    backend = "summeruniversity-static"
    priority = 110
      [frontends.summeruniversity-static.routes.main]
      rule = "Host:my.localhost;PathPrefix:/media/summeruniversity;PathPrefixStrip:/media/summeruniversity"

    [frontends.discounts]
    backend = "discounts"
    priority = 110
      [frontends.discounts.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/api/discounts"

    [frontends.mailer]
    backend = "mailer"
    priority = 110
      [frontends.mailer.routes.main]
      rule = "Host:my.localhost;PathPrefixStrip:/api/mailer"

    [frontends.portal]
    backend = "portal"
    priority = 20
      [frontends.portal.routes.main]
      rule = "Host:portal.localhost"

    [frontends.traefik]
    backend = "traefik"
    priority = 20
      [frontends.traefik.routes.main]
      rule = "Host:traefik.localhost"

    [frontends.portainer]
    backend = "portainer"
    priority = 20
      [frontends.portainer.routes.main]
      rule = "Host:portainer.localhost"

    [frontends.pgadmin]
    backend = "pgadmin"
    priority = 20
      [frontends.pgadmin.routes.main]
      rule = "Host:pgadmin.localhost"

    [frontends.swagger]
    backend = "swagger"
    priority = 20
      [frontends.swagger.routes.main]
      rule = "Host:apidocs.localhost"

  [backends]
    [backends.frontend.servers.s1]
    url = "http://frontend:80"
    [backends.core.servers.s1]
    url = "http://core:8084"
    [backends.core-static.servers.s1]
    url = "http://core-static:80"
    [backends.events.servers.s1]
    url = "http://events:8084"
    [backends.events-static.servers.s1]
    url = "http://events-static:80"
    [backends.statutory.servers.s1]
    url = "http://statutory:8084"
    [backends.statutory-static.servers.s1]
    url = "http://statutory-static:80"
    [backends.network.servers.s1]
    url = "http://network:8084"
    [backends.summeruniversity.servers.s1]
    url = "http://summeruniversity:8084"
    [backends.summeruniversity-static.servers.s1]
    url = "http://summeruniversity-static:80"
    [backends.discounts.servers.s1]
    url = "http://discounts:8084"
    [backends.mailer.servers.s1]
    url = "http://mailer:4000"
    [backends.portal.servers.s1]
    url = "http://portal:80"
    [backends.traefik.servers.s1]
    url = "http://127.0.0.1:8080"
    [backends.portainer.servers.s1]
    url = "http://portainer:9000"
    [backends.pgadmin.servers.s1]
    url = "http://pgadmin:5050"
    [backends.swagger.servers.s1]
    url = "http://swagger:8080"
