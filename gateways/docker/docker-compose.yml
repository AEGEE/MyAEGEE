version: "3.4"

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_SITE_SCHEME: ${CADDY_SITE_SCHEME:-http://}
      BASE_URL: ${BASE_URL}
      SUBDOMAIN_FRONTEND: ${SUBDOMAIN_FRONTEND}
      SUBDOMAIN_PORTAL: ${SUBDOMAIN_PORTAL}
      SUBDOMAIN_PORTAINER: ${SUBDOMAIN_PORTAINER}
      SUBDOMAIN_PGADMIN: ${SUBDOMAIN_PGADMIN}
      SUBDOMAIN_APIDOCS: ${SUBDOMAIN_APIDOCS}
      SUBDOMAIN_GRAFANA: ${SUBDOMAIN_GRAFANA}
      SUBDOMAIN_PROMETHEUS: ${SUBDOMAIN_PROMETHEUS}
      SUBDOMAIN_STATPING: ${SUBDOMAIN_STATPING}
      SUBDOMAIN_BITWARDEN: ${SUBDOMAIN_BITWARDEN}
      SUBDOMAIN_SURVEY: ${SUBDOMAIN_SURVEY}
      SUBDOMAIN_RABBITMQ: ${SUBDOMAIN_RABBITMQ}
      SUBDOMAIN_MAILPIT: ${SUBDOMAIN_MAILPIT}
      SUBDOMAIN_METRICS: ${SUBDOMAIN_METRICS:-metrics.}
      METRICS_CREDENTIALS: ${METRICS_CREDENTIALS}
      PW_TRAEFIK: ${PW_TRAEFIK}
    volumes:
      - ./${PATH_GATEWAYS}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  portal:
    build:
      context: ./$PATH_GATEWAYS/portal/
      dockerfile: ./Dockerfile.dev
    image: aegee/portal:dev
    restart: always
    expose:
      - 80

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: OMS
