version: "3.4"

# Development: no automatic restarts, so the stack doesn't come back on every
# boot (`make start` starts it) and a broken container doesn't crash-loop.
# Production keeps the restart policies of docker-compose.yml.
services:
  traefik:
    restart: "no"
    volumes:
      - ./${PATH_GATEWAYS}/traefik/traefik.toml.dev:/etc/traefik/traefik.toml

  portal:
    restart: "no"
