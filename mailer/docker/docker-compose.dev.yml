version: "3.4"

services:
    mailer:
        restart: "no"
        build:
            context: ./${PATH_MAILER}/../
            dockerfile: ./docker/mailer/Dockerfile
            args:
                MIX_ENV: development
        image: aegee/mailer:dev

    mail-transfer-agent:
        restart: "no"
        build:
            context: ./${PATH_MAILER}/..
            dockerfile: docker/mail_transfer_agent/Dockerfile
        image: aegee/mail-transfer-agent:dev
