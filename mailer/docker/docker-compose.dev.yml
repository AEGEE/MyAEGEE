version: "3.4"

# Development: no automatic restarts, so the stack doesn't come back on every
# boot (`make start` starts it) and a broken container doesn't crash-loop.
# Production keeps the restart policies of docker-compose.yml.
services:
    mailer:
        restart: "no"
        build:
            context: ./${PATH_MAILER}/../
            dockerfile: ./docker/mailer/Dockerfile
            args:
                MIX_ENV: development
        image: aegee/mailer:dev

    mail-transfer-agent:
        restart: "no"
        build:
            context: ./${PATH_MAILER}/..
            dockerfile: docker/mail_transfer_agent/Dockerfile
        image: aegee/mail-transfer-agent:dev
