version: "3.4"

# Development: retry a failed start a few times (e.g. one before the database is
# ready), but don't crash-loop forever or start again on every boot. Production
# keeps the restart policies of docker-compose.yml.
services:
    mailer:
        restart: on-failure:10
        build:
            context: ./${PATH_MAILER}/../
            dockerfile: ./docker/mailer/Dockerfile
            args:
                MIX_ENV: development
        image: aegee/mailer:dev

    mail-transfer-agent:
        restart: on-failure:10
        build:
            context: ./${PATH_MAILER}/..
            dockerfile: docker/mail_transfer_agent/Dockerfile
        image: aegee/mail-transfer-agent:dev
