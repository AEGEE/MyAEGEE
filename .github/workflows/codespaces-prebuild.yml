name: Codespaces Prebuild

on:
  push:
    branches:
      - main
      - develop
      - 001-devcontainer-migration
    paths:
      - ".devcontainer/**"
      - ".github/workflows/codespaces-prebuild.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".devcontainer/**"
  workflow_dispatch:

jobs:
  prebuild:
    name: Build Dev Container for Codespaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build dev container image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: |
            echo "Dev container built successfully"
            node --version
            npm --version
            docker --version

      - name: Log build info
        run: |
          echo "✅ Dev container prebuild completed"
          echo "📦 Image size: $(docker images --format '{{.Size}}' | head -n 1)"
          echo "🐳 Docker version: $(docker --version)"
          echo "📦 Node.js version available in container"
