version: 2
updates:
  # Git submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # NPM dependencies across all workspaces
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/core"
      - "/events"
      - "/frontend"
      - "/discounts"
      - "/knowledge"
      - "/network"
      - "/statutory"
      - "/summeruniversity"
      - "/mailer"
      - "/gsuite-wrapper"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"
    groups:
      dev-tooling:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Docker images across all modules
  - package-ecosystem: "docker"
    directories:
      - "/core/docker/core"
      - "/discounts/docker/discounts"
      - "/events/docker/events"
      - "/frontend/docker"
      - "/gsuite-wrapper/docker"
      - "/knowledge/docker/knowledge"
      - "/mailer/docker/mailer"
      - "/mailer/docker/mail_transfer_agent"
      - "/network/docker/network"
      - "/statutory/docker/statutory"
      - "/summeruniversity/docker/summeruniversity"
      - "/gateways/docker/portal"
      - "/monitor/docker/logstash"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"
    groups:
      docker-images:
        applies-to: version-updates
        patterns:
          - "*"

  # GitHub Actions across all modules
  - package-ecosystem: "github-actions"
    directories:
      - "/core"
      - "/discounts"
      - "/events"
      - "/frontend"
      - "/gsuite-wrapper"
      - "/knowledge"
      - "/network"
      - "/statutory"
      - "/summeruniversity"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
