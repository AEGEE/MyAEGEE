version: 2
updates:
  # Git submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # NPM dependencies across all workspaces
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/core"
      - "/events"
      - "/frontend"
      - "/discounts"
      - "/knowledge"
      - "/network"
      - "/statutory"
      - "/summeruniversity"
      - "/mailer"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # Docker images across all modules
  - package-ecosystem: "docker"
    directories:
      - "/core/docker/core"
      - "/discounts/docker/discounts"
      - "/events/docker/events"
      - "/frontend/docker"
      - "/knowledge/docker/knowledge"
      - "/mailer/docker/mailer"
      - "/mailer/docker/mail_transfer_agent"
      - "/network/docker/network"
      - "/statutory/docker/statutory"
      - "/summeruniversity/docker/summeruniversity"
      - "/gateways/docker/portal"
      - "/monitor/docker/logstash"
      - "/dispatcher/docker"
      - "/docker/nginx-static"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # Images referenced from docker-compose files (databases, monitoring, third-party services).
  # Postgres major bumps need a dump/restore of the data volume; don't merge them as-is.
  - package-ecosystem: "docker-compose"
    directories:
      - "/core/docker"
      - "/dev-tools/docker"
      - "/discounts/docker"
      - "/dispatcher/docker"
      - "/events/docker"
      - "/frontend/docker"
      - "/gateways/docker"
      - "/knowledge/docker"
      - "/mailer/docker"
      - "/monitor-agents/docker"
      - "/monitor/docker"
      - "/network/docker"
      - "/pass-manager/docker"
      - "/statutory/docker"
      - "/summeruniversity/docker"
      - "/survey/docker"
      - "/url-shortener/docker"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # GitHub Actions across all modules
  - package-ecosystem: "github-actions"
    directories:
      - "/core"
      - "/discounts"
      - "/events"
      - "/frontend"
      - "/knowledge"
      - "/network"
      - "/statutory"
      - "/summeruniversity"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"
