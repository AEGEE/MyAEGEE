version: 2
updates:
  # Git submodules
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # NPM dependencies across all workspaces
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/core"
      - "/events"
      - "/frontend"
      - "/discounts"
      - "/network"
      - "/statutory"
      - "/summeruniversity"
      - "/mailer"
    # Every PR runs the full CI, so keep the number of PRs down:
    # - minor and patch updates: one PR per workspace
    # - major updates: one PR per package across all workspaces (e.g. express 4 -> 5)
    # Security updates are not grouped (groups only apply to version updates).
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      majors:
        group-by: dependency-name
        update-types:
          - "major"
    # The frontend stays on Vue 2.7; it won't move to Vue 3. The next major of each
    # of these packages needs Vue 3 (or, for mapbox-gl, breaks the Vue 2-only
    # vue-mapbox wrapper), so Dependabot would keep reopening PRs we can't merge.
    ignore:
      - dependency-name: "vue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vuex"
        update-types: ["version-update:semver-major"]
      - dependency-name: "buefy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-multiselect"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vue-flatpickr-component"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fortawesome/vue-fontawesome"
        update-types: ["version-update:semver-major"]
      # vue-mapbox 0.4 needs mapbox-gl ^0.53, so 0.54 is already too new.
      - dependency-name: "mapbox-gl"
        versions: [">=0.54"]
      # @fortawesome/vue-fontawesome 2 (the Vue 2 version) only supports
      # fontawesome-svg-core 1 and 6, so stay on Font Awesome 6.
      - dependency-name: "@fortawesome/fontawesome-svg-core"
        versions: [">=7"]
      - dependency-name: "@fortawesome/free-solid-svg-icons"
        versions: [">=7"]
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # Docker images across all modules
  - package-ecosystem: "docker"
    directories:
      - "/core/docker/core"
      - "/discounts/docker/discounts"
      - "/events/docker/events"
      - "/frontend/docker"
      - "/mailer/docker/mailer"
      - "/mailer/docker/mail_transfer_agent"
      - "/network/docker/network"
      - "/statutory/docker/statutory"
      - "/summeruniversity/docker/summeruniversity"
      - "/gateways/docker/portal"
      - "/monitor/docker/logstash"
      - "/dispatcher/docker"
      - "/docker/nginx-static"
    # nginx-static follows nginx's stable branch (even minor versions); the odd
    # minor versions are mainline releases.
    ignore:
      - dependency-name: "nginx"
        versions: [">= 1.31, < 1.32", ">= 1.33, < 1.34"]
    # Base images are pinned by digest. Bump each image in all Dockerfiles in one
    # PR (node:26-alpine alone is used by eight of them) instead of one per directory.
    groups:
      base-images:
        group-by: dependency-name
        patterns:
          - "*"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # Images referenced from docker-compose files (databases, monitoring, third-party services).
  - package-ecosystem: "docker-compose"
    # A database major bump can't start on the existing data volume (it needs a
    # dump/restore), so only patch/minor updates are proposed for databases.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-major"]
    directories:
      - "/core/docker"
      - "/dev-tools/docker"
      - "/discounts/docker"
      - "/dispatcher/docker"
      - "/events/docker"
      - "/frontend/docker"
      - "/gateways/docker"
      - "/mailer/docker"
      - "/monitor-agents/docker"
      - "/monitor/docker"
      - "/network/docker"
      - "/pass-manager/docker"
      - "/statutory/docker"
      - "/summeruniversity/docker"
      - "/survey/docker"
      - "/url-shortener/docker"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"

  # GitHub Actions across all modules
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/core"
      - "/discounts"
      - "/events"
      - "/frontend"
      - "/network"
      - "/statutory"
      - "/summeruniversity"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 99
    reviewers:
      - "WikiRik"
