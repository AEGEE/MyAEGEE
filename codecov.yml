codecov:
  branch: stable
  require_ci_to_pass: true
  notify:
    # The sum of parallelism over the six test jobs that upload (discounts, network, events and
    # summeruniversity run unsharded), plus mailer-test and dispatcher-test, plus one for the
    # frontend: Codecov counts the sessions of the commit's report, and the frontend flag is
    # carried forward (flag_management below), so the report has exactly one frontend session
    # whether frontend-coverage ran or not (docs/testing/coverage.md). Checked by
    # packages/backend-test-utils/check-codecov-builds.js.
    after_n_builds: 15

coverage:
  status:
    # codecov/project and codecov/patch are about the six services, which have unit tests and a
    # coverage ratchet of their own. Frontend code is kept out of them: its gate is the one
    # per area in the frontend-tests workflow (docs/testing/coverage.md), and most areas are
    # not enforced there yet. The mailer and the dispatcher are kept out of them too: their
    # gates are the coverage minimums their CI jobs enforce (mailer/coveralls.json,
    # dispatcher/pyproject.toml), and a status that failed on any drop would fail on the
    # mailer's one timing-dependent line.
    project:
      default:
        target: auto
        threshold: 0%
        paths: &services
          - "core/**"
          - "discounts/**"
          - "events/**"
          - "network/**"
          - "statutory/**"
          - "summeruniversity/**"
      # codecov/project/dispatcher and codecov/project/mailer: reported, never failing.
      dispatcher:
        target: auto
        informational: true
        paths: &dispatcher
          - "dispatcher/**"
      # codecov/project/frontend: reported, never failing, until the last area's gate is enforced.
      frontend:
        target: auto
        informational: true
        paths: &frontend
          - "frontend/**"
      mailer:
        target: auto
        informational: true
        paths: &mailer
          - "mailer/**"
    patch:
      default:
        target: auto
        paths: *services
      # codecov/patch/dispatcher, codecov/patch/frontend and codecov/patch/mailer: as above.
      dispatcher:
        target: auto
        informational: true
        paths: *dispatcher
      frontend:
        target: auto
        informational: true
        paths: *frontend
      mailer:
        target: auto
        informational: true
        paths: *mailer

# frontend-coverage only runs when the frontend tests passed. When it does not run, Codecov
# copies the frontend's coverage from the parent commit, and that copy counts toward
# after_n_builds in place of the upload; when it runs, its upload replaces the copy. The
# uploads that run on every push must not be carried forward: their copy would count before
# they arrive. No paths and no statuses here: the frontend statuses are the path-based ones
# above.
flag_management:
  individual_flags:
    - name: frontend
      carryforward: true

# mailer-test runs the mailer's tests in a container with mailer/ mounted at /app, so its
# lcov.info names files /app/lib/...
fixes:
  - "/app/::mailer/"

comment:
  layout: "condensed_header, diff, components, condensed_files, condensed_footer"
  after_n_builds: 15  # as above; checked by packages/backend-test-utils/check-codecov-builds.js

component_management:
  individual_components:
    - component_id: core
      name: core
      paths: ["core/**"]
    - component_id: discounts
      name: discounts
      paths: ["discounts/**"]
    - component_id: dispatcher
      name: dispatcher
      paths: ["dispatcher/**"]
    - component_id: events
      name: events
      paths: ["events/**"]
    - component_id: frontend
      name: frontend
      paths: ["frontend/**"]
    - component_id: mailer
      name: mailer
      paths: ["mailer/**"]
    - component_id: network
      name: network
      paths: ["network/**"]
    - component_id: statutory
      name: statutory
      paths: ["statutory/**"]
    - component_id: summeruniversity
      name: summeruniversity
      paths: ["summeruniversity/**"]
