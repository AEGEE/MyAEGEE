codecov:
  branch: stable
  require_ci_to_pass: true
  notify:
    after_n_builds: 25  # 6 test jobs x parallelism 4, plus frontend-coverage; checked by packages/backend-test-utils/check-codecov-builds.js

coverage:
  status:
    # codecov/project and codecov/patch are about the six services, which have unit tests and a
    # coverage ratchet of their own. Frontend code is kept out of them: its gate is the one
    # per area in the frontend-tests workflow (docs/testing/coverage.md), and most areas are
    # not enforced there yet.
    project:
      default:
        target: auto
        threshold: 0%
        paths: &services
          - "core/**"
          - "discounts/**"
          - "events/**"
          - "network/**"
          - "statutory/**"
          - "summeruniversity/**"
      # codecov/project/frontend: reported, never failing, until the last area's gate is enforced.
      frontend:
        target: auto
        informational: true
        paths: &frontend
          - "frontend/**"
    patch:
      default:
        target: auto
        paths: *services
      # codecov/patch/frontend: as above.
      frontend:
        target: auto
        informational: true
        paths: *frontend

comment:
  layout: "condensed_header, diff, components, condensed_files, condensed_footer"
  after_n_builds: 25  # checked by packages/backend-test-utils/check-codecov-builds.js

component_management:
  individual_components:
    - component_id: core
      name: core
      paths: ["core/**"]
    - component_id: discounts
      name: discounts
      paths: ["discounts/**"]
    - component_id: events
      name: events
      paths: ["events/**"]
    - component_id: frontend
      name: frontend
      paths: ["frontend/**"]
    - component_id: network
      name: network
      paths: ["network/**"]
    - component_id: statutory
      name: statutory
      paths: ["statutory/**"]
    - component_id: summeruniversity
      name: summeruniversity
      paths: ["summeruniversity/**"]
