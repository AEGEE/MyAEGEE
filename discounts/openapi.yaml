openapi: 3.1.1
info:
  title: MyAEGEE discounts
  version: '1'
  description: |
    Partner discounts for AEGEE members. Discounts managers add partners ("integrations")
    and their codes; members claim codes and see the codes they claimed. Categories hold the
    partner descriptions that the discounts page lists.

    Every route except the health check and the metrics needs a core access token in
    `X-Auth-Token`. The service checks it against core (`GET /members/me` and
    `GET /my_permissions`) on every request.
  license: {name: ISC, identifier: ISC}
servers:
  - url: /api/discounts
security:
  - XAuthToken: []
tags:
  - name: general
  - name: integrations
  - name: categories
paths:
  /healthcheck:
    get:
      operationId: getHealthcheck
      summary: Health check
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthcheckResponse'}
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics of the stored data
      description: Open in the service; the gateway puts basic authentication in front of it.
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /metrics/requests:
    get:
      operationId: getRequestMetrics
      summary: Prometheus metrics of the requests per endpoint
      description: Open in the service; the gateway puts basic authentication in front of it.
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /integrations:
    get:
      operationId: listIntegrations
      summary: List the partners
      tags: [integrations]
      x-permission: authenticated
      responses:
        '200':
          description: Every integration, without its codes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createIntegration
      summary: Add a partner
      tags: [integrations]
      x-permission: manage:discounts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationCreateInput'}
      responses:
        '200':
          description: The created integration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /integrations/{integration_id}/codes:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: addIntegrationCodes
      summary: Add codes to a partner
      description: |
        Stores each code once per integration, so two members are never handed the same code.
        Codes are compared without the spaces around them: a code the request has twice is
        stored once, and a code the integration has already refuses the whole request with 422.
      tags: [integrations]
      x-permission: manage:discounts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CodesInput'}
      responses:
        '200':
          description: The codes are stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: The body is not an array, or an empty one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: >-
            A code is not a string with more than spaces in it or is longer than 255 characters,
            or the integration has some of the codes already, which the message names. No code
            is stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/{integration_id}/claim:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: claimIntegrationCode
      summary: Claim a code of a partner
      description: |
        Gives the caller a free code of the integration and mails it to their notification
        address. The mail is best effort: when it fails, the code is still claimed and the
        answer is still 200.

        403 has three causes, each with its own message: the caller is not a member of an
        antenna, contact antenna or contact that still exists; the caller reached the
        integration's quota for the current day, month or year; or no free code is left.

        Claims of one integration run one at a time. A claim waits for the claims before it
        at most `claim.lockTimeout` milliseconds (3 seconds by default) and then answers 503
        without claiming a code.
      tags: [integrations]
      x-permission: authenticated, and a member of a body of type antenna, contact antenna or contact that is not deleted
      responses:
        '200':
          description: The claimed code.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodeResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: The integration does not exist, or it was deleted while the claim waited for the claims before it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: 'Other claims of the integration held it longer than the lock timeout; nothing is claimed. Message: "Other claims of this integration are being processed. Please try again in a moment."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /integrations/{integration_id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    get:
      operationId: getIntegration
      summary: One partner
      tags: [integrations]
      x-permission: authenticated
      responses:
        '200':
          description: The integration, without its codes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateIntegration
      summary: Edit a partner
      tags: [integrations]
      x-permission: manage:discounts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationUpdateInput'}
      responses:
        '200':
          description: The edited integration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteIntegration
      summary: Delete a partner
      tags: [integrations]
      x-permission: manage:discounts
      responses:
        '200':
          description: The deleted integration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 'The integration has codes, so it is kept: there is no route to delete codes, so an integration that has codes cannot be deleted. Members see their claimed codes with it. Message: "The integration has codes, so it cannot be deleted. Codes cannot be deleted either, so the integration stays."'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /codes/mine:
    get:
      operationId: listMyCodes
      summary: The codes the caller claimed
      tags: [integrations]
      x-permission: authenticated (own codes only)
      responses:
        '200':
          description: The caller's codes with their integrations, the latest claim first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CodeWithIntegrationListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /categories:
    get:
      operationId: listCategories
      summary: List the categories
      tags: [categories]
      x-permission: authenticated
      responses:
        '200':
          description: Every category with its partner descriptions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createCategory
      summary: Add a category
      tags: [categories]
      x-permission: manage:discounts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryCreateInput'}
      responses:
        '200':
          description: The created category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /categories/{category_id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      operationId: getCategory
      summary: One category
      tags: [categories]
      x-permission: authenticated
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateCategory
      summary: Edit a category
      tags: [categories]
      x-permission: manage:discounts
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryUpdateInput'}
      responses:
        '200':
          description: The edited category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteCategory
      summary: Delete a category
      tags: [categories]
      x-permission: manage:discounts
      responses:
        '200':
          description: The deleted category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    XAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Access token issued by core. Other services check it against core on every request.
  parameters:
    IntegrationId:
      name: integration_id
      in: path
      required: true
      description: |
        The integration's id when the value is all digits (up to the largest Postgres
        integer), otherwise its `code`. An integration whose code is all digits is therefore
        only found by its id.
      schema: {type: [integer, string]}
    CategoryId:
      name: category_id
      in: path
      required: true
      description: The category's id. Anything but digits within the Postgres integer range answers 400.
      schema: {type: integer, minimum: 0, maximum: 2147483647}
  responses:
    BadRequest: {description: 'Malformed request, for example a non-numeric ID.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: 'No token, or the token was rejected.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: 'Authenticated but not allowed (see x-permission).', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: 'A resource in the path does not exist.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationFailed: {description: 'Validation failed.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/ErrorWithMessage'
        - $ref: '#/components/schemas/ErrorWithFields'
    ErrorWithMessage:
      type: object
      required: [success, message]
      properties:
        success: {const: false}
        message: {type: string}
      additionalProperties: false
    ErrorWithFields:
      type: object
      required: [success, errors]
      properties:
        success: {const: false}
        errors:
          type: object
          additionalProperties: {type: array, items: {type: string}}
      additionalProperties: false
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {const: true}
        message: {type: string}
      additionalProperties: false
    Timestamps:
      type: object
      required: [created_at, updated_at]
      properties:
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    HealthcheckResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: object
          required: [name, description, version]
          properties:
            name: {type: string}
            description: {type: string}
            version: {type: string}
          additionalProperties: false
      additionalProperties: false
    IntegrationQuotaPeriod:
      type: string
      enum: [day, month, year]
    Integration:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [id, name, code, quota_period, quota_amount, description]
      properties:
        id: {type: integer}
        name: {type: string}
        code: {type: string}
        quota_period: {$ref: '#/components/schemas/IntegrationQuotaPeriod'}
        quota_amount: {type: integer, minimum: 1}
        description:
          description: Markdown, shown on the discounts pages and in the claim mail.
          type: [string, 'null']
      unevaluatedProperties: false
    IntegrationCreateInput:
      description: >-
        The name and the code are stored without the spaces around them and may have at most
        255 characters after that, which a schema cannot express.
      type: object
      required: [name, code, quota_period, quota_amount]
      properties:
        name: {type: string, minLength: 1}
        code: {type: string, minLength: 1}
        quota_period: {$ref: '#/components/schemas/IntegrationQuotaPeriod'}
        quota_amount: {$ref: '#/components/schemas/QuotaAmountInput'}
        description: {type: [string, 'null']}
      additionalProperties: true
    IntegrationUpdateInput:
      description: >-
        The name and the code are stored without the spaces around them and may have at most
        255 characters after that, which a schema cannot express.
      type: object
      properties:
        name: {type: string, minLength: 1}
        code: {type: string, minLength: 1}
        quota_period: {$ref: '#/components/schemas/IntegrationQuotaPeriod'}
        quota_amount: {$ref: '#/components/schemas/QuotaAmountInput'}
        description: {type: [string, 'null']}
      additionalProperties: true
    QuotaAmountInput:
      description: A whole number from 1, or a string of digits, which is stored as a number.
      type: [integer, string]
      minimum: 1
      pattern: '^[0-9]+$'
    IntegrationResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Integration'}
      additionalProperties: false
    IntegrationListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/Integration'}}
      additionalProperties: false
    CodesInput:
      description: >-
        The codes to add, each a string with more than spaces in it. Each code is stored
        without the spaces around it and may have at most 255 characters after that, which a
        schema cannot express.
      type: array
      minItems: 1
      items: {type: string, pattern: '\S'}
    CodeFields:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [id, value, integration_id, claimed_by]
      properties:
        id: {type: integer}
        value: {type: string}
        integration_id: {type: integer}
        claimed_by:
          description: The id of the member who claimed the code, null while it is free.
          type: [integer, 'null']
    Code:
      type: object
      allOf:
        - $ref: '#/components/schemas/CodeFields'
      unevaluatedProperties: false
    CodeWithIntegration:
      type: object
      allOf:
        - $ref: '#/components/schemas/CodeFields'
      required: [integration]
      properties:
        integration: {$ref: '#/components/schemas/Integration'}
      unevaluatedProperties: false
    CodeResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Code'}
      additionalProperties: false
    CodeWithIntegrationListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/CodeWithIntegration'}}
      additionalProperties: false
    Partner:
      description: One partner's entry on the discounts page.
      type: object
      required: [icon, name, shortDescription, longDescription]
      properties:
        icon: {type: string}
        name: {type: string}
        shortDescription: {type: string}
        longDescription: {type: string}
      additionalProperties: false
    Category:
      type: object
      allOf:
        - $ref: '#/components/schemas/Timestamps'
      required: [id, name, discounts]
      properties:
        id: {type: integer}
        name: {type: string}
        discounts: {type: array, items: {$ref: '#/components/schemas/Partner'}}
      unevaluatedProperties: false
    PartnerInput:
      type: object
      required: [icon, name, shortDescription, longDescription]
      properties:
        icon: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        shortDescription: {type: string, minLength: 1}
        longDescription: {type: string, minLength: 1}
      additionalProperties: false
    CategoryCreateInput:
      type: object
      required: [name, discounts]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        discounts: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PartnerInput'}}
      additionalProperties: true
    CategoryUpdateInput:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        discounts: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PartnerInput'}}
      additionalProperties: true
    CategoryResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Category'}
      additionalProperties: false
    CategoryListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/Category'}}
      additionalProperties: false
