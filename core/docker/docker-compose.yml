services:
    postgres-core:
        restart: always
        image: postgres:10.21
        volumes:
            - postgres-core:/var/lib/postgresql/data
        expose:
            - "5432"
        environment:
            POSTGRES_USER: "postgres"
            POSTGRES_PASSWORD: "${PW_POSTGRES}"

    core:
        restart: always
        image: aegee/core:latest
        volumes:
            - core-media:/usr/app/media
            - shared:/usr/app/shared:ro
            - core-state:/usr/app/src/state:rw
        depends_on:
            - postgres-core
        expose:
            - "8084"
        environment:
            BUGSNAG_KEY: "${BUGSNAG_KEY_CORE}"
            PG_PASSWORD: "${PW_POSTGRES}"
            NODE_ENV: "${MYAEGEE_ENV}"
            HOST: "${SUBDOMAIN_FRONTEND}${BASE_URL}"
            CORE_LOGIN: "${CORE_LOGIN}"
            CORE_PASSWORD: "${CORE_PASSWORD}"
            LISTSERV_EMAIL: "${LISTSERV_EMAIL}"
            LISTSERV_ENDPOINT: "${LISTSERV_ENDPOINT}"
            LISTSERV_TOKEN: "${LISTSERV_TOKEN}"
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
    core-static:
        restart: on-failure
        image: aegee/nginx-static:latest
        volumes:
            - core-media:/usr/app/media:ro
            - ./${PATH_CORE}/core-static/status.json:/usr/app/status.json:ro
            - ./${PATH_CORE}/core-static/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./${PATH_CORE}/core-static/sites/default:/etc/nginx/sites-available/default:ro
            - shared:/usr/app/shared:ro
        expose:
            - "80"
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
volumes:
    postgres-core:
        driver: local
    core-media:
        driver: local
    shared:
        driver: local
    core-state:
        driver: local

networks:
    default:
        name: OMS
