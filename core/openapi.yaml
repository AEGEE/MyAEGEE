      tags: [body-memberships]
      x-permission: delete_member:body
      responses:
        '200':
          description: The membership is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bodies/{body_id}/join-requests/{request_id}/status:
    parameters:
      - $ref: '#/components/parameters/BodyId'
      - name: request_id
        in: path
        required: true
        schema: {type: integer}
    put:
      operationId: setJoinRequestStatus
      summary: Approve or reject a join request
      description: |
        Approving makes the member a member of the body and keeps the request. Rejecting
        deletes the request, so that the member can ask again.
      tags: [join-requests]
      x-permission: process:join_request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [approved, rejected]}
              additionalProperties: true
      responses:
        '200':
          description: The request is processed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: A request id that is not a number, another status than approved or rejected, or a request that was processed already.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: Approving the request of somebody who became a member of the body in the meantime.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /circles/{circle_id}/my_permissions:
