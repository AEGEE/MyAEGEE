# The API of core: members, bodies, circles, permissions, campaigns, payments and the
# Resources page. Hand-written; every response of the jest tests is checked against it
# (docs/testing/backend-openapi.md). Paths are in the order of lib/server.js.
openapi: 3.1.1
info:
  title: MyAEGEE core
  version: '1'
  description: |
    Members, bodies, circles, permissions, signup campaigns, membership fee payments and
    the Resources page of MyAEGEE. The other services check every request against
    `GET /members/me` and `GET /my_permissions` of this one.

    A 500 answer (`ErrorResponse`) is possible on every operation and is not listed. So is
    a 400 answer for a request body that is not valid JSON.
  license: {name: ISC, identifier: ISC}
servers:
  - url: /api/core
security:
  - XAuthToken: []
tags:
  - name: generic
  - name: metrics
  - name: endpoint-metrics
  - name: campaigns
  - name: register
  - name: members
  - name: login
  - name: bodies
  - name: bug-report
  - name: my-permissions
  - name: circles
  - name: permissions
  - name: resources
  - name: imageserv
  - name: body-campaigns
  - name: body-memberships
  - name: join-requests
  - name: payments
  - name: circle-permissions
  - name: circle-memberships
paths:
  /healthcheck:
    get:
      operationId: getHealthcheck
      summary: Health check
      tags: [generic]
      x-permission: none
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthcheckResponse'}
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics of the data (numbers of members, bodies, circles)
      tags: [metrics]
      x-permission: none
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /metrics/requests:
    get:
      operationId: getRequestMetrics
      summary: Prometheus metrics of the handled requests
      tags: [endpoint-metrics]
      x-permission: none
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /signup/{campaign_id}:
    parameters:
      - name: campaign_id
        in: path
        required: true
        description: The `url` of the campaign. Unlike on `/campaigns/{campaign_id}`, an id does not work here.
        schema: {type: string}
    post:
      operationId: registerUser
      summary: Register an account through a signup campaign
      description: |
        Creates the member, adds them to the campaign's autojoin body if it has one, and
        mails a confirmation link. The account cannot log in before the email is confirmed.
      tags: [campaigns]
      x-permission: none; the campaign must be active
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserSignupInput'}
      responses:
        '200':
          description: The created member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSignupResponse'}
        '403':
          description: The campaign is not active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /confirm-email:
    post:
      operationId: confirmEmail
      summary: Confirm the email of a new account
      tags: [register]
      x-permission: none; needs the token from the confirmation mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenInput'}
      responses:
        '200':
          description: The account is confirmed and can log in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: No token, or a token that is not a string.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: The token has expired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: No confirmation with this token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /confirm-email-change:
    post:
      operationId: confirmEmailChange
      summary: Confirm a change of the login email
      description: |
        Takes the token that was mailed to the new address, or the one that was mailed to
        the current address when somebody else requested the change. The email changes once
        every address that has to confirm has done so; until then `data.changed` is false
        and `data.waiting_for` names the address that is still missing.
      tags: [members]
      x-permission: none; needs a token from one of the email change mails
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenInput'}
      responses:
        '200':
          description: Confirmed. `data` tells whether the email has changed already.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailChangeConfirmationResponse'}
        '404':
          description: No token, an unknown or expired token, or the login email changed since the request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: The new address belongs to another account by now.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/Busy'}
  /login:
    post:
      operationId: login
      summary: Log in with a username, login email or Google Workspace account
      description: |
        Unlike the other operations, the answer has no `data`: the tokens are at the top
        level. The other services log their service accounts in here.
      tags: [login]
      x-permission: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, description: 'Username, login email or Google Workspace account; case and surrounding spaces are ignored.'}
                password: {type: string}
              additionalProperties: true
      responses:
        '200':
          description: A new access token and refresh token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokensResponse'}
        '403':
          description: The name or password does not match, the account is suspended, or its email is not confirmed yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /logout:
    post:
      operationId: logout
      summary: Log out by deleting a refresh token
      tags: [login]
      x-permission: none; needs the refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenInput'}
      responses:
        '200':
          description: The refresh token is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: No token, or a token that is not a string.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: No such refresh token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /password_reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset mail
      description: |
        Answers the same whether or not the address belongs to an account. The reset is
        created and mailed after the answer.
      tags: [login]
      x-permission: none
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: [string, 'null'], description: The login email of the account.}
              additionalProperties: true
      responses:
        '200':
          description: The request is taken.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: The email is not a string.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /password_confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with the token from a password reset mail
      description: Ends all sessions of the member.
      tags: [login]
      x-permission: none; needs the token from the password reset mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, minLength: 8}
              additionalProperties: true
      responses:
        '200':
          description: The password is changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '404':
          description: No token, or an unknown or expired one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /renew:
    post:
      operationId: renewTokens
      summary: Exchange a refresh token for a new access token and refresh token
      description: |
        The refresh token is rotated: the old one keeps working for a short grace period, so
        that two renews at the same time both succeed. Like login, the answer has no `data`.
      tags: [login]
      x-permission: none; needs the refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshTokenInput'}
      responses:
        '200':
          description: A new access token and refresh token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokensResponse'}
        '403':
          description: No token, an unknown or used-up token, or the token of a suspended member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/Busy'}
  /bodies:
    get:
      operationId: listBodies
      summary: List bodies
      description: |
        Sorted by name unless `sort` says otherwise. Without a login only antennae, contact
        antennae and contacts are listed.
      tags: [bodies]
      x-permission: none; all=true needs global:view_deleted:body
      security: [{}, {XAuthToken: []}]
      parameters:
        - name: all
          in: query
          description: Any value includes deleted bodies. Needs a login and `global:view_deleted:body`.
          schema: {type: string}
        - name: type
          in: query
          description: Only bodies of these types, separated by commas.
          schema: {type: string}
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The bodies.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyListResponse'}
        '400':
          description: A `sort` field that bodies do not have, or a `type` that is not a text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: '`all` without a login.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: '`all` without `global:view_deleted:body`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      operationId: createBody
      summary: Create a body
      tags: [bodies]
      x-permission: global:create:body
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BodyCreateInput'}
      responses:
        '200':
          description: The created body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bug-report:
    post:
      operationId: reportBug
      summary: Send a bug report to the issue tracker
      description: |
        Forwards the report and its screenshots to the Atlassian service desk. Without
        `email`, the notification email of the logged-in member is used. At most 10 reports
        per hour from one address.
      tags: [bug-report]
      x-permission: none
      security: [{}, {XAuthToken: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                summary: {type: string}
                description: {type: string}
                email: {type: string}
                screenshots:
                  type: array
                  maxItems: 3
                  items: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          description: The issue is created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '422':
          description: The form could not be read (too many or too large files), or the issue tracker refused the report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Too many bug reports from this address.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: The issue tracker could not be reached or failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /my_permissions:
    get:
      operationId: listMyPermissions
      summary: The global permissions of the current member
      description: |
        A superadmin gets every permission of every scope. The other services read
        `combined` of each row to decide what the member may do.
      tags: [my-permissions]
      x-permission: authenticated
      responses:
        '200':
          description: The permissions. Not paginated and without `meta`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyPermissionsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: listMyCirclesWithPermission
      summary: The circles through which the current member holds a local permission
      description: |
        The other services use the `body_id` of these circles to find the bodies in which
        the member holds the permission.
      tags: [my-permissions]
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, object]
              properties:
                action: {type: string}
                object: {type: string}
              additionalProperties: true
      responses:
        '200':
          description: The circles, each with the member's own memberships of it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CircleWithCircleMembershipsListResponse'}
        '400':
          description: No `action` or `object`, or a `sort` field that circles do not have.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: There is no local permission with this action and object.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /members:
    get:
      operationId: listMembers
      summary: List members
      tags: [members]
      x-permission: global:view:member
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserListResponse'}
        '400': {$ref: '#/components/responses/BadSort'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members_search:
    get:
      operationId: searchMembers
      summary: Search members by name or email
      description: |
        With `global:search:member` the search covers all members, optionally narrowed by
        `body_id`. Without it `body_id` is required (at most 10 bodies) and the caller must
        be a member of at least one of them.

        With `global:view:member` the search covers names, emails and Google Workspace
        accounts, and each result has the contact fields, with the total in `meta.count`.
        Everybody else searches by name or an exact email, needs a query of at least 2
        characters, and gets at most 50 results with ids and names only and an empty `meta`.
      tags: [members]
      x-permission: global:search:member, or member of one of the bodies in body_id
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: body_id
          in: query
          description: Body ids, separated by commas. Values that are not ids are ignored.
          schema: {type: string}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: sort
          in: query
          description: A member field to sort by. A field that the results do not have is replaced by `id`.
          schema: {type: string}
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The results, in one of two shapes (see above).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSearchResponse'}
        '400':
          description: '`body_id` given more than once, more than 10 bodies, or a `sort` field that members do not have.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /members_email:
    get:
      operationId: listMemberEmails
      summary: The notification emails of members
      description: The other services use this to mail members.
      tags: [members]
      x-permission: global:mail:member, or only the caller's own id
      parameters:
        - name: query
          in: query
          required: true
          description: One member id or several, separated by commas.
          schema: {type: string, pattern: '^\d+(,\d+)*$'}
      responses:
        '200':
          description: The id and notification email of each member that exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserEmailListResponse'}
        '400':
          description: No `query`, or one that is not a list of ids.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /circles:
    get:
      operationId: listCircles
      summary: List circles
      tags: [circles]
      x-permission: authenticated
      parameters:
        - name: all
          in: query
          description: Any value includes the circles that are bound to a body. Without it only free circles are listed.
          schema: {type: string}
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The circles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CircleListResponse'}
        '400': {$ref: '#/components/responses/BadSort'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createCircle
      summary: Create a free circle
      description: A circle of a body is created with `POST /bodies/{body_id}/circles`.
      tags: [circles]
      x-permission: global:create:circle
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CircleCreateInput'}
      responses:
        '200':
          description: The created circle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CircleResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /permissions:
    get:
      operationId: listPermissions
      summary: List permissions
      tags: [permissions]
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The permissions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionListResponse'}
        '400': {$ref: '#/components/responses/BadSort'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createPermission
      summary: Create a permission
      tags: [permissions]
      x-permission: global:create:permission
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionCreateInput'}
      responses:
        '200':
          description: The created permission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /campaigns:
    get:
      operationId: listCampaigns
      summary: List signup campaigns
      tags: [campaigns]
      x-permission: global:view:campaign
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The campaigns.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignListResponse'}
        '400': {$ref: '#/components/responses/BadSort'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createCampaign
      summary: Create a signup campaign
      tags: [campaigns]
      x-permission: global:create:campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignCreateInput'}
      responses:
        '200':
          description: The created campaign.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /resources:
    get:
      operationId: listResources
      summary: The sections of the Resources page with their links
      tags: [resources]
      x-permission: authenticated
      responses:
        '200':
          description: The sections in page order, each with its links in order. Not paginated and without `meta`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCategoryWithLinksListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /resources/categories:
    post:
      operationId: createResourceCategory
      summary: Add a section to the Resources page
      description: The new section goes last.
      tags: [resources]
      x-permission: global:manage:resources
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceCategoryCreateInput'}
      responses:
        '200':
          description: The created section.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCategoryResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /resources/links:
    post:
      operationId: createResourceLink
      summary: Add a link to a section of the Resources page
      description: The new link goes last in its section.
      tags: [resources]
      x-permission: global:manage:resources
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceLinkCreateInput'}
      responses:
        '200':
          description: The created link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceLinkResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /members/{user_id}/my_permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listMyPermissionsForMember
      summary: The permissions of the current member on another member
      description: |
        The global permissions, plus the local ones that the current member holds in a body
        of that member, plus the join request ones held in a body that member asked to join.
      tags: [my-permissions]
      x-permission: authenticated
      responses:
        '200':
          description: The permissions. Not paginated and without `meta`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyPermissionsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{user_id}/active:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setMemberActive
      summary: Suspend or reactivate a member
      description: A suspended member cannot log in or renew a session, and their tokens stop working.
      tags: [members]
      x-permission: update_active:user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Without `active` nothing changes.
              properties:
                active: {type: boolean}
              additionalProperties: true
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserWithMembershipsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /members/{user_id}/event-application-ban:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setEventApplicationBan
      summary: Ban a member from applying to events
      description: Replaces an active ban of the member. The ban ends by itself at `ban_until`.
      tags: [members]
      x-permission: global:update_application_ban:member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ban_until]
              properties:
                ban_until: {type: string, description: 'A date or date and time in the future, at most 3 months from now.'}
              additionalProperties: true
      responses:
        '200':
          description: The new ban.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventApplicationBanResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: liftEventApplicationBan
      summary: Lift the event application ban of a member
      tags: [members]
      x-permission: global:update_application_ban:member
      responses:
        '200':
          description: The ban is lifted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such member, or the member has no active ban.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /members/{user_id}/superadmin:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setMemberSuperadmin
      summary: Make a member a superadmin, or take that away
      tags: [members]
      x-permission: global:update_superadmin:member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Without `superadmin` nothing changes.
              properties:
                superadmin: {type: boolean}
              additionalProperties: true
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserWithMembershipsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /members/{user_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: confirmMember
      summary: Confirm the email of a member for them
      tags: [members]
      x-permission: global:confirm:member
      responses:
        '200':
          description: The member, now confirmed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserWithMembershipsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{user_id}/primary-body:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setPrimaryBody
      summary: Set or unset the primary body of a member
      description: |
        The member has to be in the body. Without `primary_body_id`, or with null, the
        primary body is unset.
      tags: [members]
      x-permission: update:member, or the member themselves
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primary_body_id: {type: [integer, string, 'null'], description: 'A body the member belongs to, as a number or as a text of digits. Null unsets the primary body.'}
              additionalProperties: true
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserWithMembershipsResponse'}
        '400':
          description: '`primary_body_id` is not a number.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not allowed, or the member does not belong to that body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: No such member or body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /members/{user_id}/email:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: requestEmailChange
      summary: Request a change of the login email of a member
      description: |
        Mails a confirmation link to the new address; the email changes with
        `POST /confirm-email-change`. When somebody else asks for the change and does not
        hold `global:update:member`, the member's current address has to confirm it as well
        (`data.needs_old_address_confirmation`).
      tags: [members]
      x-permission: update:member, or the member themselves
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email]
              properties:
                new_email: {type: string}
              additionalProperties: true
      responses:
        '200':
          description: The change is requested and the mails are sent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmailChangeRequestResponse'}
        '400':
          description: No `new_email`, or one that is not a string.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The address is on a restricted domain, belongs to another account, or is not an email address.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/Busy'}
  /members/{user_id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setMemberPassword
      summary: Change the password of a member
      tags: [members]
      x-permission: update:member, or the member themselves; needs the current password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, password]
              properties:
                old_password: {type: string}
                password: {type: string, minLength: 8}
              additionalProperties: true
      responses:
        '200':
          description: The password is changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: No or a wrong `old_password`, or a new password that is not valid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /members/{user_id}/listserv:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: subscribeListserv
      summary: Subscribe a member to AEGEE mailing lists
      tags: [members]
      x-permission: global:subscribe:listserv, or the member themselves
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mailinglists]
              properties:
                mailinglists:
                  type: array
                  minItems: 1
                  items: {type: string, description: 'One of AEGEE-L, AEGEENEWS-L, ANNOUNCE-L and AEGEE-EVENT-L, in any case.'}
              additionalProperties: true
      responses:
        '200':
          description: The subscription request is sent to the list server.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400':
          description: No `mailinglists`, or not an array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: An empty list, an item that is not a string, or a list that does not exist.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /members/{user_id}/lookup:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: lookupMember
      summary: The name and addresses of a member
      tags: [members]
      x-permission: lookup:member or view:member, or the member themselves
      responses:
        '200':
          description: The member's id, names and addresses.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserLookupResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getMember
      summary: One member, or the current member with `me`
      description: |
        The other services call `GET /members/me` with the caller's token on every request,
        and read `id`, the names, `notification_email`, `superadmin` and `bodies`.

        With `view:member`, and for the member themselves, the answer is the whole member
        with their bodies, memberships, join requests and circles. `event_application_ban`
        is only there for the member themselves and for holders of
        `global:update_application_ban:member`; it is null without an active ban.

        With only `view_members:body` the answer has just the id, names and addresses.
      tags: [members]
      x-permission: view:member, or the member themselves; view_members:body gives a short version
      responses:
        '200':
          description: The member, in one of two shapes (see above).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {const: true}
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/UserWithMemberships'
                      - $ref: '#/components/schemas/UserLimited'
                additionalProperties: false
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateMember
      summary: Update the profile of a member
      description: |
        `gsuite_id` is only taken from holders of `global:update:member` and ignored from
        everybody else. The login email, password, primary body and the `active` and
        `superadmin` flags have their own operations.
      tags: [members]
      x-permission: update:member, or the member themselves
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserWithMembershipsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteMember
      summary: Delete a member
      tags: [members]
      x-permission: delete:member
      responses:
        '200':
          description: The member is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/{user_id}/upload:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: uploadMemberImage
      summary: Upload the profile picture of a member
      description: A PNG or JPEG of at most 5 MB. Replaces the picture the member had.
      tags: [imageserv]
      x-permission: update:member, or the member themselves
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [head_image]
              properties:
                head_image: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          description: The picture is stored. `data` is its file name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: No file, a file that is too large, or one that is not a PNG or JPEG.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /members/{user_id}/image:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: deleteMemberImage
      summary: Remove the profile picture of a member
      tags: [imageserv]
      x-permission: update:member, or the member themselves
      responses:
        '200':
          description: The picture is removed. `data` is null.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The member has no picture.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /bodies/{body_id}:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: getBody
      summary: One body
      description: The other services read `name`, `code`, `type`, `status` and `email`.
      tags: [bodies]
      x-permission: none; a deleted body needs view_deleted:body
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: The body with its circles and its shadow circle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyWithCirclesResponse'}
        '403':
          description: The body is deleted and the caller may not see deleted bodies.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateBody
      summary: Update a body
      description: |
        A permission with `filters` limits the change to those fields; the other fields in
        the request are ignored. A new `shadow_circle_id` has to be a circle of this body.
      tags: [bodies]
      x-permission: update:body
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BodyInput'}
      responses:
        '200':
          description: The body with its circles and its shadow circle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyWithCirclesResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/my_permissions:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: listMyPermissionsForBody
      summary: The permissions of the current member in a body
      description: The global permissions, plus the local ones held through the circles of this body.
      tags: [my-permissions]
      x-permission: authenticated
      responses:
        '200':
          description: The permissions. Not paginated and without `meta`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyPermissionsResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bodies/{body_id}/campaigns:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: listBodyCampaigns
      summary: List the signup campaigns that add new members to a body
      tags: [body-campaigns]
      x-permission: view:campaign
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The campaigns.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignListResponse'}
        '400': {$ref: '#/components/responses/BadSort'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createBodyCampaign
      summary: Create a signup campaign that adds new members to a body
      tags: [body-campaigns]
      x-permission: create:campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignCreateInput'}
      responses:
        '200':
          description: The created campaign, with this body as `autojoin_body_id` whatever the request says.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/circles:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    post:
      operationId: createBodyCircle
      summary: Create a circle of a body
      tags: [bodies]
      x-permission: create:circle
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CircleCreateInput'}
      responses:
        '200':
          description: The created circle, bound to this body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CircleResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/members:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: listBodyMemberships
      summary: List the members of a body
      description: |
        With `holds_permission[action]` and `holds_permission[object]` only the members who
        hold that local permission in this body are listed, and each `user` has the
        `circle_memberships` that give it, with their circle. The other services use this
        to find whom to mail (`user.notification_email` and the names).
      tags: [body-memberships]
      x-permission: view_members:body
      parameters:
        - name: holds_permission
          in: query
          style: deepObject
          explode: true
          description: Only members holding this local permission in the body.
          schema:
            type: object
            required: [action, object]
            properties:
              action: {type: string}
              object: {type: string}
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The memberships, each with its member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyMembershipWithUserListResponse'}
        '400':
          description: '`holds_permission` without an action or object, or a `sort` field that memberships do not have.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such body, or no local permission with the action and object of `holds_permission`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    post:
      operationId: createBodyMembership
      summary: Add a member to a body
      description: |
        The member also joins the shadow circle of the body. A member who had no body yet
        gets a welcome mail.
      tags: [body-memberships]
      x-permission: add_member:body
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserIdInput'}
      responses:
        '200':
          description: The created membership.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyMembershipResponse'}
        '400':
          description: '`user_id` is not a number.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such body or member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: The member belongs to the body already.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      operationId: deleteOwnBodyMembership
      summary: Leave a body
      tags: [body-memberships]
      x-permission: authenticated; removes the caller's own membership
      responses:
        '200':
          description: The membership is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: No such body, or the caller is not a member of it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /bodies/{body_id}/create-member:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    post:
      operationId: createBodyMember
      summary: Create an account for somebody and add them to a body
      description: |
        The account is confirmed right away and gets a random password; the new member sets
        their own with a password reset. A `password` in the request is ignored.
      tags: [bodies]
      x-permission: create_member:body
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCreateInput'}
      responses:
        '200':
          description: The membership of the new member (not the member).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyMembershipResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/join-requests:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: listJoinRequests
      summary: List the join requests of a body
      tags: [join-requests]
      x-permission: view:join_request
      parameters:
        - name: status
          in: query
          description: Only requests with this status.
          schema: {$ref: '#/components/schemas/JoinRequestStatus'}
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The join requests, each with its member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinRequestWithUserListResponse'}
        '400':
          description: A `sort` field that join requests do not have, or a `status` that is not a text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createJoinRequest
      summary: Ask to join a body
      description: Mails the body and the members who can process its join requests.
      tags: [join-requests]
      x-permission: authenticated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                motivation: {type: [string, 'null']}
              additionalProperties: true
      responses:
        '200':
          description: The created join request, with the status `pending`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinRequestResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The caller asked already, is a member of the body already, or the body is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /bodies/{body_id}/payments:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    get:
      operationId: listPayments
      summary: List the membership fee payments of a body
      tags: [payments]
      x-permission: view:payment
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The payments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentListResponse'}
        '400': {$ref: '#/components/responses/BadSort'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createPayment
      summary: Record a membership fee payment of a member of a body
      tags: [payments]
      x-permission: create:payment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentCreateInput'}
      responses:
        '200':
          description: The created payment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResponse'}
        '400':
          description: No `user_id`, or one that is not a number.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Not allowed, or the member does not belong to the body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: No such body or member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/status:
    parameters:
      - $ref: '#/components/parameters/BodyId'
    put:
      operationId: setBodyStatus
      summary: Delete or restore a body
      description: |
        Deleting a body also deletes its memberships, circles, payments and approved join
        requests. Restoring it does not bring them back.
      tags: [bodies]
      x-permission: global:delete:body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Without `status` nothing changes.
              properties:
                status: {$ref: '#/components/schemas/BodyStatus'}
              additionalProperties: true
      responses:
        '200':
          description: The body as loaded before the change, with the new status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyWithCirclesResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /bodies/{body_id}/members/{membership_id}:
    parameters:
      - $ref: '#/components/parameters/BodyId'
      - $ref: '#/components/parameters/BodyMembershipId'
    get:
      operationId: getBodyMembership
      summary: One membership of a body
      tags: [body-memberships]
      x-permission: view_members:body
      responses:
        '200':
          description: The membership with its member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyMembershipWithUserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateBodyMembership
      summary: Change the comment of a membership of a body
      tags: [body-memberships]
      x-permission: update_member:body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: [string, 'null']}
              additionalProperties: true
      responses:
        '200':
          description: The membership with its member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyMembershipWithUserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: A comment that is not a text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      operationId: deleteBodyMembership
      summary: Remove a member from a body
      description: |
