      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_id]
              properties:
                permission_id: {type: [integer, string], description: 'As a number or as a text of digits.'}
              additionalProperties: true
      responses:
        '200':
          description: The circle has the permission now.
          content:
