        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bodies/{body_id}/campaigns/{campaign_id}:
    parameters:
      - $ref: '#/components/parameters/BodyId'
      - $ref: '#/components/parameters/BodyCampaignId'
    get:
      operationId: getBodyCampaign
      summary: One signup campaign of a body
      tags: [body-campaigns]
      x-permission: view:campaign
      responses:
        '200':
          description: The campaign with its autojoin body, which is this body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignWithAutojoinBodyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateBodyCampaign
      summary: Update a signup campaign of a body
      description: The campaign stays with this body; `autojoin_body_id` in the request is ignored.
      tags: [body-campaigns]
      x-permission: update:campaign
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignInput'}
      responses:
        '200':
          description: The campaign with its autojoin body.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignWithAutojoinBodyResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteBodyCampaign
      summary: Delete a signup campaign of a body
      tags: [body-campaigns]
      x-permission: delete:campaign
      responses:
        '200':
          description: The campaign is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bodies/{body_id}/payments/{payment_id}:
    parameters:
      - $ref: '#/components/parameters/BodyId'
      - name: payment_id
        in: path
        required: true
        schema: {type: integer}
    put:
      operationId: updatePayment
      summary: Update a membership fee payment
      description: The member and the body of a payment cannot be changed.
      tags: [payments]
      x-permission: update:payment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentInput'}
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deletePayment
      summary: Delete a membership fee payment
      tags: [payments]
      x-permission: delete:payment
      responses:
        '200':
          description: The payment is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /resources/categories/{category_id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      operationId: getResourceCategory
      summary: One section of the Resources page
      tags: [resources]
      x-permission: authenticated
      responses:
        '200':
          description: The section with its links in order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCategoryWithLinksResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateResourceCategory
      summary: Rename a section of the Resources page or change its colour
      tags: [resources]
      x-permission: global:manage:resources
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceCategoryInput'}
      responses:
        '200':
          description: The section, without its links.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCategoryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteResourceCategory
      summary: Delete an empty section of the Resources page
      tags: [resources]
      x-permission: global:manage:resources
      responses:
        '200':
          description: The section is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The section still has links.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /resources/categories/{category_id}/links/order:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    put:
      operationId: setResourceLinksOrder
      summary: Put the links of a section of the Resources page in a new order
      tags: [resources]
      x-permission: global:manage:resources
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '200':
          description: The section with its links in the new order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCategoryWithLinksResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: '`ids` is not a list of the ids of all links of the section, each once.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /resources/links/{link_id}:
    parameters:
      - name: link_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: getResourceLink
      summary: One link of the Resources page
      tags: [resources]
      x-permission: authenticated
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceLinkResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateResourceLink
      summary: Update a link of the Resources page
      description: A link that moves to another section goes last there.
      tags: [resources]
      x-permission: global:manage:resources
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceLinkInput'}
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceLinkResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteResourceLink
      summary: Delete a link of the Resources page
      tags: [resources]
      x-permission: global:manage:resources
      responses:
        '200':
          description: The link is deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /members/unconfirmed:
    get:
      operationId: listUnconfirmedMembers
      summary: List the members who have not confirmed their email yet
      description: Registered before the member routes, so `unconfirmed` is not read as a username here.
      tags: [members]
      x-permission: global:view_unconfirmed:member
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserListResponse'}
        '400': {$ref: '#/components/responses/BadSort'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /resources/categories/order:
    put:
      operationId: setResourceCategoriesOrder
      summary: Put the sections of the Resources page in a new order
      description: Registered before the section routes, so `order` is not read as a section id here.
      tags: [resources]
      x-permission: global:manage:resources
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
      responses:
        '200':
          description: All sections in the new order, each with its links.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceCategoryWithLinksListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: '`ids` is not a list of the ids of all sections, each once.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
components:
  securitySchemes:
    XAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: |
        Access token from `POST /login` or `POST /renew`. A token that is unknown or
        expired, or that belongs to a suspended member, counts as no token.
  parameters:
    Limit: {name: limit, in: query, description: 'Page size. Without it everything is returned.', schema: {type: integer, minimum: 1}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0}}
    Sort: {name: sort, in: query, description: 'A field of the listed rows to sort by, `id` by default.', schema: {type: string}}
    Direction: {name: direction, in: query, schema: {type: string, enum: [asc, desc]}}
    Query: {name: query, in: query, description: 'Text to search for, in any case.', schema: {type: string}}
    UserId:
      name: user_id
      in: path
      required: true
      description: A member id, a username (in any case), or `me` for the current member. Express routes all three through this path.
      schema: {type: [integer, string]}
    BodyId:
      name: body_id
      in: path
      required: true
      description: A body id, or the three-letter code of the body (in any case).
      schema: {type: [integer, string]}
    CircleId:
      name: circle_id
      in: path
      required: true
      schema: {type: integer}
    PermissionId:
      name: permission_id
      in: path
      required: true
      schema: {type: integer}
    CampaignId:
      name: campaign_id
      in: path
      required: true
      description: A campaign id, or the `url` of the campaign.
      schema: {type: [integer, string]}
    BodyCampaignId:
      name: campaign_id
      in: path
      required: true
      description: A campaign id. Unlike on `/campaigns/{campaign_id}`, the `url` does not work here.
      schema: {type: integer}
    BodyMembershipId:
      name: membership_id
      in: path
      required: true
      description: The id of the membership, not of the member.
      schema: {type: integer}
    CircleMembershipId:
      name: membership_id
      in: path
      required: true
      description: The id of the membership, not of the member.
      schema: {type: integer}
    CategoryId:
      name: category_id
      in: path
      required: true
      schema: {type: integer}
  responses:
    BadRequest: {description: 'Malformed request: an ID that is not a number, or a `sort` field that the listed rows do not have.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    BadSort: {description: 'A `sort` field that the listed rows do not have.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: 'No token, or the token was rejected.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: 'Authenticated but not allowed (see x-permission).', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Busy: {description: 'Another request for the same token or member is being processed for longer than the lock timeout (3 seconds). Nothing was changed; try again.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: 'A resource in the path does not exist.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationFailed: {description: 'Validation failed.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/ErrorWithMessage'
        - $ref: '#/components/schemas/ErrorWithFields'
    ErrorWithMessage:
      type: object
      required: [success, message]
      properties:
        success: {const: false}
        message: {type: string}
      additionalProperties: false
    ErrorWithFields:
      description: Validation messages per field.
      type: object
      required: [success, errors]
      properties:
        success: {const: false}
        errors:
          type: object
          additionalProperties: {type: array, items: {type: string}}
      additionalProperties: false
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {const: true}
        message: {type: string}
      additionalProperties: false
    ListMeta:
      type: object
      required: [count]
      properties:
        count: {type: integer, minimum: 0, description: The number of rows on all pages together.}
      additionalProperties: false
    Decimal:
      description: Sequelize DECIMAL. A number when read from Postgres, the input value right after create or update.
      type: [string, number]
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    HealthcheckResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: object
          required: [name, description, version]
          properties:
            name: {type: string}
            description: {type: string}
            version: {type: string}
          additionalProperties: false
      additionalProperties: false
    TokensResponse:
      description: The answer of login and renew. The tokens are at the top level, not in `data`.
      type: object
      required: [success, access_token, refresh_token]
      properties:
        success: {const: true}
        access_token: {type: string, description: 'For the `X-Auth-Token` header. Valid for 10 minutes.'}
        refresh_token: {type: string, description: 'For `POST /renew` and `POST /logout`.'}
      additionalProperties: false
    TokenInput:
      type: object
      required: [token]
      properties:
        token: {type: string}
      additionalProperties: true
    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string}
      additionalProperties: true
    UserIdInput:
      type: object
      required: [user_id]
      properties:
        user_id: {type: [integer, string], description: 'As a number or as a text of digits.'}
      additionalProperties: true
    OrderInput:
      type: object
      required: [ids]
      properties:
        ids:
          description: The ids of all items, each once, in the new order.
          type: array
          items: {type: integer}
      additionalProperties: true
    EmailChangeConfirmationResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {const: true}
        message: {type: string}
        data:
          type: object
          required: [changed]
          properties:
            changed: {type: boolean, description: Whether the login email has changed.}
            waiting_for:
              description: The address that still has to confirm. Only there while `changed` is false.
              type: string
              enum: [new_email, old_email]
          additionalProperties: false
      additionalProperties: false
    EmailChangeRequestResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {const: true}
        message: {type: string}
        data:
          type: object
          required: [needs_old_address_confirmation]
          properties:
            needs_old_address_confirmation: {type: boolean, description: Whether the current address of the member has to confirm the change as well.}
          additionalProperties: false
      additionalProperties: false
    ImageResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {const: true}
        message: {type: string}
        data: {type: [string, 'null'], description: 'The file name of the profile picture, null after removing it.'}
      additionalProperties: false
    UserPrimaryEmail:
      description: Which address `notification_email` is, the login email or the Google Workspace account.
      type: string
      enum: [personal, gsuite]
    UserFields:
      description: The columns of a member. The password is never among them.
      type: object
      required: [notification_email, id, username, email, mail_confirmed_at, active, superadmin, privacy_consent, first_name, last_name, date_of_birth, gender, phone, address, image, about_me, primary_email, last_logged_in, last_active, gsuite_id, created_at, updated_at, campaign_id, primary_body_id]
      properties:
        notification_email: {type: [string, 'null'], description: 'Where mails to the member go: `gsuite_id` when `primary_email` is gsuite, `email` otherwise.'}
        id: {type: integer}
        username: {type: string}
        email: {type: string, description: The login email.}
        mail_confirmed_at: {type: [string, 'null'], format: date-time}
        active: {type: boolean, description: False for a suspended member.}
        superadmin: {type: boolean}
        privacy_consent: {type: [string, 'null'], format: date-time}
        first_name: {type: string}
        last_name: {type: string}
        date_of_birth: {type: [string, 'null'], format: date}
        gender: {type: [string, 'null']}
        phone: {type: [string, 'null']}
        address: {type: [string, 'null']}
        image: {type: [string, 'null'], description: The file name of the profile picture.}
        about_me: {type: [string, 'null']}
        primary_email: {$ref: '#/components/schemas/UserPrimaryEmail'}
        last_logged_in: {type: [string, 'null'], format: date-time}
        last_active: {type: [string, 'null'], format: date-time}
        gsuite_id: {type: [string, 'null'], description: The Google Workspace account.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        campaign_id: {type: [integer, 'null'], description: The signup campaign through which the member registered.}
        primary_body_id: {type: [integer, 'null']}
    User:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserFields'
      unevaluatedProperties: false
    UserWithMemberships:
      description: |
        A member with their bodies, memberships, join requests and circles. The other
        services read `id`, the names, `notification_email`, `gender`, `date_of_birth`,
        `superadmin` and `bodies` (`id`, `name`, `code`, `type`, `status`).
      type: object
      allOf:
        - $ref: '#/components/schemas/UserFields'
      required: [bodies, primary_body, body_memberships, join_requests, circles]
      properties:
        bodies:
          type: array
          items: {$ref: '#/components/schemas/BodyWithMembership'}
        primary_body:
          oneOf:
            - $ref: '#/components/schemas/Body'
            - type: 'null'
        body_memberships:
          type: array
          items: {$ref: '#/components/schemas/BodyMembership'}
        join_requests:
          type: array
          items: {$ref: '#/components/schemas/JoinRequest'}
        circles:
          type: array
          items: {$ref: '#/components/schemas/CircleWithMembership'}
        event_application_ban:
          description: |
            The active ban, or null. Only on `GET /members/{user_id}`, for the member
            themselves and for holders of `global:update_application_ban:member`.
          oneOf:
            - $ref: '#/components/schemas/EventApplicationBan'
            - type: 'null'
      unevaluatedProperties: false
    UserWithCircles:
      description: A member with their circle memberships and circles.
      type: object
      allOf:
        - $ref: '#/components/schemas/UserFields'
      required: [circle_memberships, circles]
      properties:
        circle_memberships:
          type: array
          items: {$ref: '#/components/schemas/CircleMembership'}
        circles:
          type: array
          items: {$ref: '#/components/schemas/CircleWithMembership'}
      unevaluatedProperties: false
    UserWithCircleMemberships:
      description: A member with circle memberships and the circle of each.
      type: object
      allOf:
        - $ref: '#/components/schemas/UserFields'
      required: [circle_memberships]
      properties:
        circle_memberships:
          type: array
          items: {$ref: '#/components/schemas/CircleMembershipWithCircle'}
      unevaluatedProperties: false
    UserLimited:
      description: What holders of `view_members:body` see of a member they may not view in full.
      type: object
      required: [id, first_name, last_name, email, notification_email]
      properties:
        id: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: string}
        notification_email: {type: [string, 'null']}
      additionalProperties: false
    UserLookup:
      type: object
      required: [id, first_name, last_name, username, email, gsuite_id, notification_email]
      properties:
        id: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
        username: {type: string}
        email: {type: string}
        gsuite_id: {type: [string, 'null']}
        notification_email: {type: [string, 'null']}
      additionalProperties: false
    UserSearchName:
      description: A search result for callers without `global:view:member`.
      type: object
      required: [id, first_name, last_name]
      properties:
        id: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
      additionalProperties: false
    UserSearchContact:
      description: A search result for holders of `global:view:member`.
      type: object
      required: [id, first_name, last_name, username, email, gsuite_id]
      properties:
        id: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
        username: {type: string}
        email: {type: string}
        gsuite_id: {type: [string, 'null']}
      additionalProperties: false
    UserEmail:
      type: object
      required: [id, notification_email]
      properties:
        id: {type: integer}
        notification_email: {type: [string, 'null']}
      additionalProperties: false
    UserInput:
      description: The profile fields of a member. Unknown fields are ignored.
      type: object
      properties:
        username: {type: string, description: 'Letters, digits, dots, underscores and dashes, with at least one letter. Stored in lower case. At most 255 characters after trimming.'}
        first_name: {type: string, description: 'At most 255 characters after trimming.'}
        last_name: {type: string, description: 'At most 255 characters after trimming.'}
        date_of_birth: {type: [string, 'null'], description: A date in the past. An empty string unsets it.}
        gender: {type: [string, 'null'], description: 'At most 255 characters after trimming.'}
        gsuite_id: {type: [string, 'null'], description: 'An address on aegee.org or aegee.eu. Only taken from holders of `global:update:member`. At most 255 characters after trimming.'}
        phone: {type: [string, 'null'], description: 'At most 255 characters after trimming.'}
        privacy_consent: {type: [string, 'null'], description: The date and time of the consent.}
        address: {type: [string, 'null']}
        about_me: {type: [string, 'null']}
        primary_email: {$ref: '#/components/schemas/UserPrimaryEmail'}
      additionalProperties: true
    UserCreateInput:
      description: The fields of a new account. Unknown fields are ignored.
      type: object
      required: [username, email, first_name, last_name]
      properties:
        username: {type: string, description: 'Letters, digits, dots, underscores and dashes, with at least one letter. Stored in lower case. At most 255 characters after trimming.'}
        email: {type: string, description: 'The login email. Not on aegee.org or aegee.eu. At most 255 characters after trimming.'}
        password: {type: string, minLength: 8, maxLength: 255}
        first_name: {type: string, description: 'At most 255 characters after trimming.'}
