### KNOWLEDGE     #######################################
services:
    postgres-knowledge:
        image: postgres:10.21
        volumes:
            - postgres-knowledge:/var/lib/postgresql/data
        expose:
            - "5432"
        environment:
            POSTGRES_USER: "postgres"
            POSTGRES_PASSWORD: "${PW_POSTGRES}"

    knowledge:
        image: aegee/knowledge:latest
        volumes:
            - knowledge-media:/usr/app/media
            - shared:/usr/app/shared:ro
        depends_on:
            - postgres-knowledge
        expose:
            - "8084"
        environment:
            BUGSNAG_KEY: "${BUGSNAG_KEY_KNOWLEDGE}"
            PG_PASSWORD: "${PW_POSTGRES}"
            NODE_ENV: "${MYAEGEE_ENV}"
            HOST: "${SUBDOMAIN_FRONTEND}${BASE_URL}"
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8084/healthcheck"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        # cpu_count: 1
        # mem_limit: 900m
volumes:
    postgres-knowledge:
        driver: local
    knowledge-media:
        driver: local
    shared:
        driver: local

networks:
    default:
        name: OMS
