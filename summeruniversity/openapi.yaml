        first_draft: {type: boolean}
        first_approval: {type: boolean}
        first_submission: {type: boolean}
        second_draft: {type: boolean}
        second_approval: {type: boolean}
        second_submission: {type: boolean}
      additionalProperties: false
    EventPermissionFields:
      description: What the caller may do with a Summer University. Shared by the event and application permissions.
      type: object
      properties:
        approve_summeruniversity: {$ref: '#/components/schemas/PermissionsPerType'}
        manage_summeruniversity: {$ref: '#/components/schemas/PermissionsPerType'}
        apply_general: {type: boolean}
        create_summeruniversity: {type: boolean}
        manage_seasons: {type: boolean}
        edit_su_type: {type: boolean}
        edit_su_fee: {type: boolean}
        set_board_comment: {$ref: '#/components/schemas/PermissionsPerBody'}
        see_boardview: {$ref: '#/components/schemas/BoardviewPermissions'}
        see_summeruniversity: {type: boolean}
        edit_summeruniversity: {type: boolean}
        delete_summeruniversity: {type: boolean}
        apply: {type: boolean, description: Only for a logged-in caller.}
        see_own_application: {type: boolean, description: Only for a logged-in caller.}
        list_applications: {type: boolean}
        approve_participants: {type: boolean}
        set_participants_cancelled: {type: boolean}
        set_participants_attended: {type: boolean}
        set_participants_confirmed: {type: boolean}
        edit_summeruniversity_open_call: {type: boolean}
        export_pax: {type: boolean}
        change_status: {$ref: '#/components/schemas/StatusPermissions'}
    EventPermissions:
      type: object
      allOf:
        - $ref: '#/components/schemas/EventPermissionFields'
      required: [approve_summeruniversity, manage_summeruniversity, apply_general, create_summeruniversity, manage_seasons, edit_su_type, edit_su_fee, set_board_comment, see_boardview, see_summeruniversity, edit_summeruniversity, delete_summeruniversity, list_applications, approve_participants, set_participants_cancelled, set_participants_attended, set_participants_confirmed, edit_summeruniversity_open_call, export_pax, change_status]
      unevaluatedProperties: false
    ApplicationPermissions:
      type: object
      allOf:
        - $ref: '#/components/schemas/EventPermissionFields'
      required: [approve_summeruniversity, manage_summeruniversity, apply_general, create_summeruniversity, manage_seasons, edit_su_type, edit_su_fee, set_board_comment, see_boardview, see_summeruniversity, edit_summeruniversity, delete_summeruniversity, apply, see_own_application, list_applications, approve_participants, set_participants_cancelled, set_participants_attended, set_participants_confirmed, edit_summeruniversity_open_call, export_pax, change_status, view_application, edit_application, set_application_cancelled]
      properties:
        view_application: {type: boolean}
        edit_application: {type: boolean}
        set_application_cancelled: {type: boolean}
      unevaluatedProperties: false
    ApplicationFields:
      description: The columns of an application but the board comment, shared by the variants below.
      type: object
      required: [id, user_id, event_id, first_name, last_name, nationality, travelling_from, visa_required, visa_place_of_birth, visa_passport_number, visa_passport_issue_date, visa_passport_expiration_date, visa_passport_issue_authority, visa_embassy, visa_street_and_house, visa_postal_code, visa_city, visa_country, body_id, body_name, status, confirmed, attended, cancelled, aegee_experience, ideal_su, motivation, answers, meals, allergies, agreed_to_privacy_policy, agreed_to_su_terms, created_at, updated_at]
      properties:
        id: {type: integer}
        user_id: {type: integer}
        event_id: {type: integer}
        first_name: {type: string}
        last_name: {type: string}
        nationality: {type: string}
        travelling_from: {type: string}
        visa_required: {type: boolean}
        visa_place_of_birth: {type: [string, 'null']}
        visa_passport_number: {type: [string, 'null']}
        visa_passport_issue_date: {type: [string, 'null']}
        visa_passport_expiration_date: {type: [string, 'null']}
        visa_passport_issue_authority: {type: [string, 'null']}
        visa_embassy: {type: [string, 'null']}
        visa_street_and_house: {type: [string, 'null']}
        visa_postal_code: {type: [string, 'null']}
        visa_city: {type: [string, 'null']}
        visa_country: {type: [string, 'null']}
        body_id: {type: integer}
        body_name: {type: string}
        status: {type: string, enum: [pending, accepted, rejected]}
        confirmed: {type: boolean}
        attended: {type: boolean}
        cancelled: {type: boolean}
        aegee_experience: {type: string}
        ideal_su: {type: string}
        motivation: {type: string}
        answers: {type: array, items: {$ref: '#/components/schemas/Answer'}}
        meals: {type: string}
        allergies: {type: [string, 'null']}
        agreed_to_privacy_policy: {type: boolean}
        agreed_to_su_terms: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ApplicantFields:
      description: The applicant's details from core, which most application responses add.
      type: object
      required: [gender, date_of_birth, notification_email]
      properties:
        gender: {type: [string, 'null'], description: From the applicant's core profile.}
        date_of_birth: {type: [string, 'null'], format: date, description: From the applicant's core profile.}
        notification_email: {type: [string, 'null'], description: From the applicant's core profile.}
    BoardComment:
      description: |
        The board's comment on the applicant. Left out of the answers the applicant gets about
        their own application (the ForApplicant variants), unless they may also list the
        applications of the Summer University or set board comments for the application's body.
      type: [string, 'null']
    Application:
      description: An application as organizers, managers and boards get it.
      type: object
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
      required: [board_comment]
      properties:
        board_comment: {$ref: '#/components/schemas/BoardComment'}
      unevaluatedProperties: false
    ApplicationForApplicant:
      description: An application as its applicant gets it, without the board comment.
      type: object
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
      unevaluatedProperties: false
    ApplicationWithUser:
      description: An application with the applicant's gender, date of birth and notification email from core, as organizers, managers and boards get it.
      type: object
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
        - $ref: '#/components/schemas/ApplicantFields'
      required: [board_comment]
      properties:
        board_comment: {$ref: '#/components/schemas/BoardComment'}
      unevaluatedProperties: false
    ApplicationWithUserForApplicant:
      description: An application with the applicant's gender, date of birth and notification email from core, as its applicant gets it, without the board comment.
      type: object
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
        - $ref: '#/components/schemas/ApplicantFields'
      unevaluatedProperties: false
    ApplicationWithEvent:
      description: 'An application with what a board needs of the Summer University it belongs to.'
      type: object
      allOf:
        - $ref: '#/components/schemas/ApplicationFields'
      required: [board_comment, event]
      properties:
        board_comment: {$ref: '#/components/schemas/BoardComment'}
        event: {$ref: '#/components/schemas/BoardviewEvent'}
      unevaluatedProperties: false
    ApplicationListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/Application'}}
      additionalProperties: false
    ApplicationWithEventListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/ApplicationWithEvent'}}
      additionalProperties: false
    ApplicationMessageResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {const: true}
        message: {type: string}
        data:
          description: The applicant gets ApplicationForApplicant, unless they may see the board comment.
          anyOf:
            - $ref: '#/components/schemas/Application'
            - $ref: '#/components/schemas/ApplicationForApplicant'
      additionalProperties: false
    ApplicationWithUserMessageResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/ApplicationWithUserForCaller'}
      additionalProperties: false
    ApplicationWithUserResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/ApplicationWithUser'}
      additionalProperties: false
    ApplicationForCallerResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/ApplicationWithUserForCaller'}
      additionalProperties: false
    ApplicationWithUserForCaller:
      description: The applicant gets ApplicationWithUserForApplicant, unless they may see the board comment; everyone else ApplicationWithUser.
      anyOf:
        - $ref: '#/components/schemas/ApplicationWithUser'
        - $ref: '#/components/schemas/ApplicationWithUserForApplicant'
    ApplicationDetailsResponse:
      type: object
      required: [success, data, permissions]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/ApplicationWithUserForCaller'}
        permissions: {$ref: '#/components/schemas/ApplicationPermissions'}
      additionalProperties: false
    FutureApplication:
      type: object
      required: [service, application_id, application_status, event_id, event_name, event_type, event_starts]
      properties:
        service: {const: summeruniversity}
        application_id: {type: integer}
        application_status: {type: string, enum: [pending, accepted]}
        event_id: {type: integer}
        event_name: {type: string}
        event_type: {$ref: '#/components/schemas/EventType'}
        event_starts: {type: string, format: date-time}
      additionalProperties: false
    FutureApplicationListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/FutureApplication'}}
      additionalProperties: false
    StatsCount:
      type: object
      required: [type, value]
      properties:
        type: {type: string}
        value: {type: integer, minimum: 0}
      additionalProperties: false
    StatusCount:
      type: object
      required: [type, value]
      properties:
        type: {type: string, enum: [total_applications, total_members, confirmed]}
        value: {type: integer, minimum: 0}
      additionalProperties: false
    StatsResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: object
          required: [by_event, by_body, by_nationality, by_status]
          properties:
            by_event: {type: array, description: Applications per Summer University (type is its name)., items: {$ref: '#/components/schemas/StatsCount'}}
            by_body: {type: array, description: Applicants per body (type is the body name; an applicant counts once)., items: {$ref: '#/components/schemas/StatsCount'}}
            by_nationality: {type: array, description: Applicants per nationality (an applicant counts once)., items: {$ref: '#/components/schemas/StatsCount'}}
            by_status: {type: array, items: {$ref: '#/components/schemas/StatusCount'}}
          additionalProperties: false
      additionalProperties: false
    Season:
      type: object
      required: [id, year, name, active, event_submission_deadline, application_period_starts, application_period_ends, created_at, updated_at]
      properties:
        id: {type: integer}
        year: {type: integer}
        name: {type: string}
        active: {type: boolean}
        event_submission_deadline: {type: [string, 'null'], format: date-time}
        application_period_starts: {type: [string, 'null'], format: date-time}
        application_period_ends: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: false
    SeasonResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/Season'}
      additionalProperties: false
    SeasonMessageResponse:
      type: object
      required: [success, message, data]
      properties:
        success: {const: true}
        message: {type: string}
        data: {$ref: '#/components/schemas/Season'}
      additionalProperties: false
    SeasonListResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/Season'}}
      additionalProperties: false
    EventInput:
      description: |
        The fields of a Summer University. id, image, status, deleted, published, the application
        period, open_call, the participant counters and the timestamps are ignored; season is
        ignored unless the caller manages the type.
      type: object
      properties:
        name: {type: string, maxLength: 255}
        url: {type: [string, 'null'], maxLength: 255}
        season: {type: [integer, string, 'null'], pattern: '^-?[0-9]+$', minimum: -2147483648, maximum: 2147483647}
        description: {type: string}
        email: {type: string, maxLength: 255}
        video: {type: [string, 'null'], maxLength: 255}
        website: {type: [string, 'null'], maxLength: 255}
        budget: {type: [string, 'null'], maxLength: 255}
        programme_suct: {type: string, maxLength: 255}
        accommodation_type: {type: string, maxLength: 255}
        starts: {$ref: '#/components/schemas/DateInput'}
        ends: {$ref: '#/components/schemas/DateInput'}
        fee: {type: [number, string], pattern: '^[+-]?([0-9]+|[0-9]*\.[0-9]{1,16383})$'}
        optional_fee: {type: [number, string, 'null'], pattern: '^[+-]?([0-9]+|[0-9]*\.[0-9]{1,16383})$'}
        type: {type: string}
        organizing_bodies: {type: array}
        cooperation: {type: [array, 'null']}
        organizers: {type: array}
        questions: {type: array}
        max_participants: {type: [integer, string, 'null'], pattern: '^[0-9]+$', minimum: 0, maximum: 2147483647}
        university_support: {type: [boolean, 'null']}
        theme: {type: string}
        theme_implementation: {type: string}
        trainers: {type: [string, 'null']}
        pax_description: {type: [string, 'null']}
        programme: {type: [string, 'null']}
        activities_list: {type: [string, 'null']}
        optional_programme: {type: [string, 'null']}
        courses: {type: [string, 'null']}
        special_equipment: {type: [string, 'null']}
        cancellation_rules: {type: [string, 'null']}
        additional_regulation: {type: [string, 'null']}
      additionalProperties: true
    ApplicationInput:
      description: The applicant's answers. Other fields (status, board_comment and so on) are ignored.
      type: object
      properties:
        body_id: {type: [integer, string]}
        nationality: {type: string, maxLength: 255}
        travelling_from: {type: string, maxLength: 255}
        visa_required: {type: boolean}
        visa_place_of_birth: {type: [string, 'null'], maxLength: 255}
        visa_passport_number: {type: [string, 'null'], maxLength: 255}
        visa_passport_issue_date: {type: [string, 'null'], maxLength: 255}
        visa_passport_expiration_date: {type: [string, 'null'], maxLength: 255}
        visa_passport_issue_authority: {type: [string, 'null'], maxLength: 255}
        visa_embassy: {type: [string, 'null'], maxLength: 255}
        visa_street_and_house: {type: [string, 'null'], maxLength: 255}
        visa_postal_code: {type: [string, 'null'], maxLength: 255}
        visa_city: {type: [string, 'null'], maxLength: 255}
        visa_country: {type: [string, 'null'], maxLength: 255}
        aegee_experience: {type: string}
        ideal_su: {type: string}
        motivation: {type: string}
        answers: {type: array}
        meals: {type: string, maxLength: 255}
        allergies: {type: [string, 'null']}
        agreed_to_privacy_policy: {type: boolean}
        agreed_to_su_terms: {type: boolean}
      additionalProperties: true
    SeasonCreateInput:
      type: object
      properties:
        year: {type: [integer, string], pattern: '^[0-9]+$', minimum: 2000, maximum: 2147483647}
        name: {type: string, maxLength: 255}
        event_submission_deadline: {$ref: '#/components/schemas/NullableDateInput'}
        application_period_starts: {$ref: '#/components/schemas/NullableDateInput'}
        application_period_ends: {$ref: '#/components/schemas/NullableDateInput'}
      additionalProperties: true
    SeasonUpdateInput:
      description: The year and the active flag are ignored.
      type: object
      properties:
        name: {type: string, maxLength: 255}
        event_submission_deadline: {$ref: '#/components/schemas/NullableDateInput'}
        application_period_starts: {$ref: '#/components/schemas/NullableDateInput'}
        application_period_ends: {$ref: '#/components/schemas/NullableDateInput'}
      additionalProperties: true
    EventStatusInput:
      type: object
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/EventStatus'}
      additionalProperties: true
    EventPublishedInput:
      type: object
      required: [published]
      properties:
        published: {$ref: '#/components/schemas/EventPublished'}
      additionalProperties: true
    ApplicationPeriodInput:
      type: object
      properties:
        application_starts: {$ref: '#/components/schemas/DateInput', description: Defaults to now.}
        application_ends: {$ref: '#/components/schemas/NullableDateInput'}
      additionalProperties: true
    OpenCallInput:
      type: object
      properties:
        open_call: {type: boolean}
        max_participants: {type: [integer, string, 'null'], pattern: '^[0-9]+$', minimum: 0, maximum: 2147483647}
      additionalProperties: true
    AttendedInput:
      type: object
      required: [attended]
      properties:
        attended: {type: boolean}
      additionalProperties: true
    CancelledInput:
      type: object
      required: [cancelled]
      properties:
        cancelled: {type: boolean}
      additionalProperties: true
    ConfirmedInput:
      type: object
      required: [confirmed]
      properties:
        confirmed: {type: boolean}
      additionalProperties: true
    ApplicationStatusInput:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [pending, accepted, rejected]}
      additionalProperties: true
    DateInput:
      description: A day (2027-07-01) or an ISO 8601 timestamp (2027-07-01T10:30:00.000Z, with or without an offset).
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]{1,3})?)?(Z|[+-][0-9]{2}:[0-9]{2})?)?$'
    NullableDateInput:
      anyOf:
        - $ref: '#/components/schemas/DateInput'
        - type: 'null'
    BoardCommentInput:
      type: object
      required: [board_comment]
      properties:
        board_comment: {type: [string, 'null']}
      additionalProperties: true
