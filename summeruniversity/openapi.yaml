# The summeruniversity API as the code answers today. Hand-written; the service's jest tests
# check every response against it. How to read and change it: docs/testing/backend-openapi.md.
openapi: 3.1.1
info:
  title: MyAEGEE summeruniversity
  version: '1'
  description: |
    Summer Universities: their submission and approval, publication, seasons and the
    applications to them.

    Every route except the health check and the metrics asks core for the caller's profile and
    permissions with the caller's `X-Auth-Token`. Routes marked as public also answer without
    a valid token, with fewer fields. Errors are `{success: false, message}`, or
    `{success: false, errors: {<field>: [<message>]}}` for validation errors.
  license: {name: ISC, identifier: ISC}
servers:
  - url: /api/summeruniversity
security:
  - XAuthToken: []
tags:
  - name: general
    description: Health check and metrics.
  - name: events
    description: Summer Universities, their status and publication.
  - name: applications
    description: Applications to Summer Universities and the statistics about them.
  - name: seasons
    description: The yearly seasons that Summer Universities belong to.
  - name: images
    description: The head image of a Summer University.
paths:
  /healthcheck:
    get:
      operationId: getHealthcheck
      summary: Health check
      tags: [general]
      x-permission: none
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthcheckResponse'}
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics of the Summer Universities and applications
      tags: [general]
      x-permission: none (the gateway asks for basic authentication)
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /metrics/requests:
    get:
      operationId: getRequestMetrics
      summary: Prometheus metrics of the requests to the service
      tags: [general]
      x-permission: none (the gateway asks for basic authentication)
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
  /:
    get:
      operationId: listEvents
      summary: List the published Summer Universities
      description: |
        Deleted and unpublished Summer Universities are left out. Each item has the fields of its
        publication level (`EventFull` or `EventMinimal`), whoever asks.
      tags: [events]
      x-permission: none (public)
      security: [{}, {XAuthToken: []}]
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/StartsFilter'
        - $ref: '#/components/parameters/EndsFilter'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: application_status
          in: query
          description: open or closed, or both as an array. Applied after offset and limit.
          schema:
            oneOf:
              - {type: string, enum: [open, closed]}
              - {type: array, items: {type: string, enum: [open, closed]}}
      responses:
        '200':
          description: The published Summer Universities, earliest start first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicEventListResponse'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      operationId: createEvent
      summary: Submit a new Summer University
      description: |
        The new Summer University starts in `first submission`, belongs to the active season
        (managers of its type may choose another), and its organizers get a mail, as does SUCT.
        The caller must be one of the organizers. Organizers must be members of one of the
        organizing or cooperation bodies, unless the caller manages Summer Universities of the type.
      tags: [events]
      x-permission: create:summeruniversity
      requestBody:
        $ref: '#/components/requestBodies/EventInput'
      responses:
        '201':
          description: The created Summer University.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventCreatedResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /mine/organizing:
    get:
      operationId: listOrganizedEvents
      summary: List the Summer Universities the caller organizes
      tags: [events]
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/StartsFilter'
        - $ref: '#/components/parameters/EndsFilter'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The caller's Summer Universities that are not deleted, earliest start first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /mine/participating:
    get:
      operationId: listParticipatingEvents
      summary: List the Summer Universities the caller applied to
      tags: [events]
      x-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/StartsFilter'
        - $ref: '#/components/parameters/EndsFilter'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The Summer Universities that are not deleted, with the status of the caller's application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventWithOwnApplicationListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /mine/approvable:
    get:
      operationId: listApprovableEvents
      summary: List the Summer Universities the caller may approve
      tags: [events]
      x-permission: authenticated; lists the types the caller holds approve_summeruniversity:<type> for
      responses:
        '200':
          description: Every Summer University of those types that is not deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /boardview/{body_id}:
    parameters:
      - name: body_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: listBodyApplications
      summary: List the applications of a body's members
      tags: [applications]
      x-permission: approve_members:summeruniversity in the body (board), or global:approve_members:summeruniversity
      responses:
        '200':
          description: The applications from the body, each with its Summer University.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationWithEventListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /applications/future/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: integer}
    get:
      operationId: listFutureApplications
      summary: List a member's applications to Summer Universities that have not started
      description: Pending and accepted applications that are not cancelled, to Summer Universities that are not deleted.
      tags: [applications]
      x-permission: global:update_application_ban:member, or manage_summeruniversity of any type
      responses:
        '200':
          description: The applications, earliest start first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FutureApplicationListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /applications:
    get:
      operationId: getApplicationStats
      summary: Statistics of the applications
      tags: [applications]
      x-permission: manage_summeruniversity or approve_summeruniversity of any type
      parameters:
        - name: season
          in: query
          description: A four-digit year; without it, every season counts.
          schema: {type: string, pattern: '^[0-9]{4}$'}
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /applications/export:
    get:
      operationId: exportApplicationStats
      summary: Export the applicants of a season per body as a spreadsheet
      tags: [applications]
      x-permission: manage_summeruniversity or approve_summeruniversity of any type
      parameters:
        - name: season
          in: query
          required: true
          description: A four-digit year.
          schema: {type: string, pattern: '^[0-9]{4}$'}
      responses:
        '200':
          description: 'One sheet, "By body": the body and its number of applicants, most applicants first.'
          headers:
            Content-Disposition:
              description: attachment; filename=su_stats_by_body_<season>.xlsx
              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /recents:
    get:
      operationId: listRecentEvents
      summary: The end of the latest Summer University per set of organizing bodies
      tags: [events]
      x-permission: authenticated
      parameters:
        - name: ends
          in: query
          description: Only Summer Universities that end on or before this day (YYYY-MM-DD).
          schema: {type: string, format: date}
      responses:
        '200':
          description: One item per distinct list of organizing bodies, over the fully published Summer Universities that are not deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecentEventListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /seasons:
    get:
      operationId: listSeasons
      summary: List the seasons
      tags: [seasons]
      x-permission: none (public)
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: The seasons, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeasonListResponse'}
    post:
      operationId: createSeason
      summary: Create a season
      description: The new season is not active. Its year cannot be changed later.
      tags: [seasons]
      x-permission: global:manage_seasons:summeruniversity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SeasonCreateInput'}
      responses:
        '201':
          description: The created season.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeasonMessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /seasons/active:
    get:
      operationId: getActiveSeason
      summary: The active season
      tags: [seasons]
      x-permission: none (public)
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: The active season.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeasonResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /seasons/{year}:
    parameters:
      - $ref: '#/components/parameters/Year'
    put:
      operationId: updateSeason
      summary: Change a season's name and dates
      description: The year and the active flag stay as they are.
      tags: [seasons]
      x-permission: global:manage_seasons:summeruniversity
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SeasonUpdateInput'}
      responses:
        '200':
          description: The changed season.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeasonMessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /seasons/{year}/active:
    parameters:
      - $ref: '#/components/parameters/Year'
    put:
      operationId: activateSeason
      summary: Make a season the active one
      description: The season that was active before is deactivated in the same transaction.
      tags: [seasons]
      x-permission: global:manage_seasons:summeruniversity
      responses:
        '200':
          description: The season, now active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeasonMessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /single/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getEvent
      summary: One Summer University
      description: |
        Organizers, and managers and approvers of the type, get every field (`Event`). Others get
        the fields of the publication level (`EventFull` or `EventMinimal`), and only when the
        Summer University is published and not deleted. `permissions` says what the caller may do;
        `apply` and `see_own_application` are only there for a logged-in caller.
      tags: [events]
      x-permission: none (public) for a published Summer University that is not deleted; otherwise its organizers, and approvers of its type
      security: [{}, {XAuthToken: []}]
      responses:
        '200':
          description: The Summer University and the caller's permissions on it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetailsResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateEvent
      summary: Edit a Summer University
      description: |
        Saving a Summer University in `first draft` submits it (`first submission`); saving one in
        `first approval` or `second draft` submits it for the second round (`second submission`).
        Only managers of the type may change the season. Organizers and SUCT get a mail.
      tags: [events]
      x-permission: organizer while the status is not second approval, or manage_summeruniversity:<type>
      requestBody:
        $ref: '#/components/requestBodies/EventInput'
      responses:
        '200':
          description: The changed Summer University.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      operationId: deleteEvent
      summary: Delete a Summer University
      description: Marks it as deleted; its applications stay.
      tags: [events]
      x-permission: manage_summeruniversity:<type>
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /single/{event_id}/status:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      operationId: setEventStatus
      summary: Move a Summer University to another status
      description: |
        Allowed transitions: first draft to first submission (organizers, approvers), first
        submission to first draft or first approval (approvers), first approval to first submission
        (approvers) or second submission (organizers, approvers), second draft to second submission
        (organizers, approvers), second submission to second draft or second approval (approvers),
        second approval to second submission (approvers). Organizers get a mail, and SUCT too when
        the new status is a submission.
      tags: [events]
      x-permission: approve_summeruniversity:<type>, or organizer for the submissions (see the description)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventStatusInput'}
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/upload:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: uploadEventImage
      summary: Upload the head image of a Summer University
      description: A .png, .jpg or .jpeg file of at most 5 MB whose content matches its extension. The previous image is removed.
      tags: [images]
      x-permission: organizer while the status is not second approval, or manage_summeruniversity:<type>
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [head_image]
              properties:
                head_image: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          description: Uploaded; `data` is the new image's file name.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageUploadResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/published:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      operationId: setEventPublished
      summary: Set the publication level of a Summer University
      description: minimal needs first approval or later; full needs second approval; none is always allowed.
      tags: [events]
      x-permission: manage_summeruniversity:<type>
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventPublishedInput'}
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /single/{event_id}/application_period:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      operationId: setEventApplicationPeriod
      summary: Set the application period of a Summer University
      description: Only for a fully published Summer University. Without application_starts, the period starts now.
      tags: [events]
      x-permission: manage_summeruniversity:<type>
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationPeriodInput'}
      responses:
        '200':
          description: The changed Summer University.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventMessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/open_call:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      operationId: setEventOpenCall
      summary: Open or close the open call of a Summer University
      description: |
        Only for a fully published Summer University. With max_participants, the maximum changes
        too and the accepted participants are counted again. The open call closes by itself when
        no spot is left.
      tags: [events]
      x-permission: organizer or manage_summeruniversity:<type>
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenCallInput'}
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/applications:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: listEventApplications
      summary: List the applications to a Summer University
      tags: [applications]
      x-permission: organizer or manage_summeruniversity:<type>
      responses:
        '200':
          description: The applications, oldest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createApplication
      summary: Apply to a Summer University
      description: |
        The caller applies with one of their bodies. The applicant, the organizers and the board of
        the body get a mail. Answers 200, not 201. The applicant gets the application without the
        board comment, unless they may see it.
      tags: [applications]
      x-permission: apply:summeruniversity while applications are open, the Summer University is fully published, and the caller has no other active application in the season and no active ban
      requestBody:
        $ref: '#/components/requestBodies/ApplicationInput'
      responses:
        '200':
          description: The created application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationMessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/applications/export:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: exportEventApplications
      summary: Export the applications to a Summer University as a spreadsheet
      description: Rejected and cancelled applications are left out.
      tags: [applications]
      x-permission: organizer or manage_summeruniversity:<type>
      responses:
        '200':
          description: 'One sheet, "Participants": the application fields, then one column per question.'
          headers:
            Content-Disposition:
              description: 'attachment; filename="participants_<event name>_<timestamp>.xlsx", with filename*=UTF-8''''… added for a name outside latin1'
              schema: {type: string}
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /single/{event_id}/applications/{application_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getApplication
      summary: One application
      description: The applicant gets their application without the board comment, unless they may list the applications of the Summer University or set board comments for the body.
      tags: [applications]
      x-permission: the applicant, an organizer or manage_summeruniversity:<type>, the board of the application's body or global:approve_members:summeruniversity, or anyone who may edit the Summer University
      responses:
        '200':
          description: The application and the caller's permissions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationDetailsResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateApplication
      summary: Edit an application
      description: A new body must be one of the applicant's bodies. The applicant, the organizers and the board of the body get a mail. The applicant gets the application without the board comment, unless they may see it.
      tags: [applications]
      x-permission: the applicant while they may apply, or anyone who may edit the Summer University
      requestBody:
        $ref: '#/components/requestBodies/ApplicationInput'
      responses:
        '200':
          description: The changed application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationWithUserMessageResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/applications/{application_id}/attended:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/ApplicationId'
    put:
      operationId: setApplicationAttended
      summary: Mark an applicant as attended or not
      description: Only a confirmed application can be marked as attended.
      tags: [applications]
      x-permission: organizer or manage_summeruniversity:<type>
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendedInput'}
      responses:
        '200':
          description: The changed application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationWithUserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/applications/{application_id}/cancelled:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/ApplicationId'
    put:
      operationId: setApplicationCancelled
      summary: Cancel an application, or take the cancellation back
      description: The accepted participants of the Summer University are counted again. The applicant gets the application without the board comment, unless they may see it.
      tags: [applications]
      x-permission: organizer or manage_summeruniversity:<type>, or the applicant while they may apply
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelledInput'}
      responses:
        '200':
          description: The changed application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationForCallerResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/applications/{application_id}/confirmed:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/ApplicationId'
    put:
      operationId: setApplicationConfirmed
      summary: Mark an applicant as confirmed or not
      description: An application marked as attended cannot be unconfirmed.
      tags: [applications]
      x-permission: organizer or manage_summeruniversity:<type>
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmedInput'}
      responses:
        '200':
          description: The changed application.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationWithUserResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /single/{event_id}/applications/{application_id}/status:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/ApplicationId'
    put:
      operationId: setApplicationStatus
      summary: Accept or reject an application
      description: The applicant gets a mail, and the accepted participants are counted again.
