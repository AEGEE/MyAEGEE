      description: A link in `description`; the frontend also sends the platform's `name`.
      type: object
      x-free-form: the model checks only the link in description; other keys (the frontend sends an empty name) are stored as sent
    Question:
      x-free-form: 'each Summer University defines its questions; the model only checks that they form a list (the frontend sends {description})'
