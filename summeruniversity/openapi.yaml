    PermissionsPerType:
      type: object
      required: [regular, pilot]
      properties:
        regular: {type: boolean}
        pilot: {type: boolean}
      additionalProperties: false
    PermissionsPerBody:
      description: Keyed by the ids of the caller's bodies.
      type: object
      additionalProperties: {type: boolean}
    BoardviewPermissions:
      description: global, and one key per id of the caller's bodies.
      type: object
      required: [global]
