components:
  securitySchemes:
    XAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Access token issued by core. Other services check it against core on every request.
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0}}
    Search: {name: search, in: query, description: Part of the name or description (case-insensitive)., schema: {type: string}}
    TypeFilter:
      name: type
      in: query
      description: One type, or several as an array (type[]=regular&type[]=pilot).
      schema:
        oneOf:
          - {$ref: '#/components/schemas/EventType'}
          - {type: array, items: {$ref: '#/components/schemas/EventType'}}
    SeasonFilter: {name: season, in: query, description: The year of the season., schema: {type: integer}}
    StartsFilter: {name: starts, in: query, description: Only Summer Universities that start on or after this day (YYYY-MM-DD)., schema: {type: string, format: date}}
    EndsFilter: {name: ends, in: query, description: Only Summer Universities that end on or before this day (YYYY-MM-DD)., schema: {type: string, format: date}}
    EventId:
      name: event_id
      in: path
      required: true
      description: The id of the Summer University, or its url (Express routes both through this path).
      schema: {type: [integer, string]}
    ApplicationId:
      name: application_id
      in: path
      required: true
      description: The id of the application, or `me` for the caller's own (Express routes both through this path).
      schema: {type: [integer, string]}
    Year:
      name: year
      in: path
      required: true
      description: The year of the season.
      schema: {type: integer}
  requestBodies:
    EventInput:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EventInput'}
    ApplicationInput:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApplicationInput'}
  responses:
    BadRequest: {description: 'Malformed request, for example a non-numeric ID.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Unauthorized: {description: 'No token, or the token was rejected.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    Forbidden: {description: 'Authenticated but not allowed (see x-permission).', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    NotFound: {description: 'A resource in the path does not exist.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    ValidationFailed: {description: 'Validation failed.', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  schemas:
    ErrorResponse:
      oneOf:
        - $ref: '#/components/schemas/ErrorWithMessage'
        - $ref: '#/components/schemas/ErrorWithFields'
    ErrorWithMessage:
      type: object
      required: [success, message]
      properties:
        success: {const: false}
        message: {type: string}
      additionalProperties: false
    ErrorWithFields:
      type: object
      required: [success, errors]
      properties:
        success: {const: false}
        message: {type: string, description: 'The field messages joined. Sent by the checks of the handlers, not by model validation.'}
        errors:
          type: object
          additionalProperties: {type: array, items: {type: string}}
      additionalProperties: false
    MessageResponse:
      type: object
      required: [success, message]
      properties:
        success: {const: true}
        message: {type: string}
      additionalProperties: false
    Decimal:
      description: Sequelize DECIMAL. A string when read from Postgres, the input value right after create or update.
      type: [string, number]
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    HealthcheckResponse:
      type: object
      required: [success, data]
      properties:
        success: {const: true}
        data:
          type: object
          required: [name, description, version]
          properties:
            name: {type: string}
            description: {type: string}
            version: {type: string}
          additionalProperties: false
      additionalProperties: false
    EventType: {type: string, enum: [regular, pilot]}
    EventStatus: {type: string, enum: [first draft, first submission, first approval, second draft, second submission, second approval]}
    EventPublished: {type: string, enum: [none, minimal, full]}
    EventThemeCategory:
      type: string
      enum: [arts_creativity, sustainability, local_culture, sports, social_equity, political_activism, mental_health, leisure, personal_development, volunteering]
    BodyRef:
      description: An organizing or cooperation body, with its name from core when it was saved.
      type: object
      required: [body_id, body_name]
      properties:
        body_id: {type: integer}
        body_name: {type: string}
      additionalProperties: false
    Location:
      type: object
      required: [name]
      properties:
        name: {type: string}
        position:
          type: object
          required: [lat, lng]
          properties:
            lat: {type: number}
            lng: {type: number}
          additionalProperties: false
        description: {type: string}
        start: {type: boolean}
        end: {type: boolean}
      additionalProperties: false
    Organizer:
      type: object
      required: [user_id, role]
