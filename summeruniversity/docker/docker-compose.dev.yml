services:
    summeruniversity:
        restart: "no"
        depends_on:
            postgres-summeruniversity:
                condition: service_healthy
        build:
            context: ./${PATH_SUMMERUNIVERSITY}/..
            dockerfile: ./docker/summeruniversity/Dockerfile
        image: aegee/summeruniversity:dev
        command: "sh -c 'sh /usr/app/scripts/bootstrap.sh && npm run nodemon-start | bunyan'"
        volumes:
            - ./${PATH_SUMMERUNIVERSITY}/../config:/usr/app/src/config
            - ./${PATH_SUMMERUNIVERSITY}/../lib:/usr/app/src/lib
            - ./${PATH_SUMMERUNIVERSITY}/../migrations:/usr/app/src/migrations
            - ./${PATH_SUMMERUNIVERSITY}/../models:/usr/app/src/models

    postgres-summeruniversity:
        restart: "no"
        # TCP: while initialising, Postgres only listens on a Unix socket.
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            interval: 5s
            timeout: 5s
            retries: 30

    summeruniversity-static:
        restart: "no"
