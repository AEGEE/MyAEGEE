# Development: no automatic restarts, so the stack doesn't come back on every
# boot (`make start` starts it) and a broken container doesn't crash-loop. The
# service waits for its database to accept connections instead of restarting
# until it does. Production keeps the restart policies of docker-compose.yml.
services:
    summeruniversity:
        restart: "no"
        depends_on:
            postgres-summeruniversity:
                condition: service_healthy
        build:
            context: ./${PATH_SUMMERUNIVERSITY}/..
            dockerfile: ./docker/summeruniversity/Dockerfile
        image: aegee/summeruniversity:dev
        command: "sh -c 'sh /usr/app/scripts/bootstrap.sh && npm run nodemon-start | bunyan'"
        volumes:
            - ./${PATH_SUMMERUNIVERSITY}/../config:/usr/app/src/config
            - ./${PATH_SUMMERUNIVERSITY}/../lib:/usr/app/src/lib
            - ./${PATH_SUMMERUNIVERSITY}/../migrations:/usr/app/src/migrations
            - ./${PATH_SUMMERUNIVERSITY}/../models:/usr/app/src/models

    postgres-summeruniversity:
        restart: "no"
        # Postgres only listens on a Unix socket while it initialises a new
        # database, so check TCP, which the service connects with.
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            interval: 5s
            timeout: 5s
            retries: 30

    summeruniversity-static:
        restart: "no"
